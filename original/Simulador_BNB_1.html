function xirr(cfs,dts,guess=0.1){if(!cfs.length)return 0;const d0=dts[0],diffs=dts.map(d=>(d-d0)/(365*864e5));let rate=guess;
for(let it=0;it<300;it++){let f=0,df=0;for(let i=0;i<cfs.length;i++){const t=diffs[i],base=1+rate;if(base<=0)continue;f+=cfs[i]/Math.pow(base,t);df-=t*cfs[i]/Math.pow(base,t+1);}

  if(C4.getDate()<=dia){const ld=new Date(C4.getFullYear(),C4.getMonth()+1,0).getDate();base=new Date(C4.getFullYear(),C4.getMonth(),Math.min(dia,ld));}
  else{const nx=edate(C4,1);const ld=new Date(nx.getFullYear(),nx.getMonth()+1,0).getDate();base=new Date(nx.getFullYear(),nx.getMonth(),Math.min(dia,ld));}

  // 1ª prestação, vencimento, qtd
  let data1a, qtdPrest;
  if(pp==='PARCELA ÚNICA'){data1a=edate(base,prazoTotal);qtdPrest=1;}
  else{const pm=PERIOD_M[pp]||1;data1a=edate(base,car+pm);qtdPrest=Math.floor(prazo/pm);}
  const venc=edate(base,prazoTotal);
  const D7=qtdPrest, K9=r2(valor/D7);
  const J4=edate(data1a,-1);

  // CÁLCULO DESEMB
  const cd=[];
  p.desembolsos.filter(d=>d.valor>0&&d.data).forEach(({data:dstr,valor:C})=>{
    const B=(dstr instanceof Date)?dstr:new Date(dstr+'T00:00:00');
    if(B>venc)return;
    const D=B.getDate(), eom0=eomonth(B,0);
    let F;
    if(D===dia)F=new Date(B);
    else{const cand=new Date(B);cand.setDate(B.getDate()+(dia-D));F=cand>eom0?eom0:cand;}
    const AD=Math.round((F-B)/864e5);
    const eom1=eomonth(B,1);
    const W_=new Date(eom1.getFullYear(),eom1.getMonth(),Math.min(dia,eom1.getDate()));
    const Xd=W_>eom1?eom1:W_;
    const G=AD>0?F:Xd;
    const H=sameDay(F,B)?new Date(B):G;
    let I=0;
    if(B<=venc){const nd=networkDays(B,H);I=ajFlag(H)===2?nd:nd-1;if(sameDay(H,B)&&ajFlag(H)!==2)I=0;}
    const Pv=I>0?r2((r6(Math.pow(1+ts,I/252))-1)*C):0;
    const Qv=I>0?r2((r6(Math.pow(1+tc,I/252))-1)*C):0;
    let AE;
    if(sameDay(B,C4))AE=C;else if(sameDay(B,venc))AE=C;else if(D===dia)AE=0;else AE=C;
    cd.push({B,C,H,I,P:Pv,Q:Qv,AE});
  });
  const sumCD=(f,dt)=>cd.reduce((s,x)=>s+(sameDay(x.H,dt)?x[f]:0),0);

  // MEMÓRIA CÁLCULO
  let O=0,Pb=0,Q=0,R=0,S=0,X=valor,AOp=0,AUp=0,prev=C4;
  let totJ=0,totK=0,totL=0;
  const totalDesembAlloc=cd.reduce((s,x)=>s+x.C,0);
  let cumDesemb=0;
  const rows=[];
  for(let m=0;m<=prazoTotal;m++){
    const Cd=m===0?new Date(base):edate(base,m);
    const AM=Cd>prev?amDays(prev,Cd):0;
    const Dm=sumCD('C',Cd), Em=sumCD('P',Cd), Fm=sumCD('Q',Cd);
    const Gm=r2((r6(Math.pow(1+ts,AM/252))-1)*R)+Em;
    const Hm=r2((r6(Math.pow(1+tc,AM/252))-1)*S)+Fm;
    const AT=sameDay(Cd,data1a)?1:0;
    let AO;
    if(AOp+1>D7)AO=0;else if(AT===1)AO=1;else if(AOp>0)AO=AOp+1;else AO=0;
    const AU=AO;
    const Bm=AU!==AUp?AU:0;
    let Im=0;
    if(!iguais&&Bm>0&&Bm<=D7)Im=reemb[Bm]||0;
    let T;
    if(Cd>venc||Bm===0)T=0;
    else if(sameDay(Cd,venc))T=X;
    else if(iguais)T=K9;
    else if(Im>0)T=Im;
    else T=X/((D7+1)-Bm);
    const Wm=(T!==0&&X!==0)?T/X:0;
    const Um=sumCD('AE',Cd);
    let Jm;
    if(sameDay(Cd,venc))Jm=Q+Um;
    else Jm=r2((Q+Um)*Wm);
    let BB=0;
    if(pc!=='NENHUMA'){
      const gate=(Cd<=J4)&&(AU===0);
      const div=PERIOD_M[pc]||3;
      BB=(gate&&m%div===0)?1:0;
    }
    let Km,Lm;
    if(data1a>Cd){Km=(O+Gm)*BB;Lm=(Pb+Hm)*BB;}
    else if(Jm===0){Km=0;Lm=0;}
    else{Km=O+Gm;Lm=Pb+Hm;}
    O=O+Gm-Km;Pb=Pb+Hm-Lm;Q=Q+Dm-Jm;R=O+Q;S=Pb+Q;
    if(T>0)X=X-T;
    if(Jm>0)totJ+=Jm;if(Km>0)totK+=Km;if(Lm>0)totL+=Lm;
    rows.push({mes:m,seq:Bm,data:Cd,disbValor:Dm,amd:AM,juroMensalSem:Gm,juroPagoSem:Km,juroPagoCom:Lm,
      principal:Jm,totalSem:Jm+Km,totalCom:Jm+Lm,bonus:Km-Lm,saldoPrinc:Math.max(Q,0),
      isGrace:Cd<data1a&&m>0,isAmort:Cd>=data1a});
    prev=Cd;AOp=AO;AUp=AU;cumDesemb+=Dm;
    if(Q<=0.01&&Cd>=data1a&&cumDesemb>=totalDesembAlloc-0.01)break;
  }

  // CET (metodologia Anexo CET da planilha): desembolsos nas datas REAIS (+),
  // custos totais na 1ª data de desembolso (−), prestações em TODAS as datas com pagamento (INCLUINDO mês 0).
  // Planilha usa prestações SEM bônus; calculamos também COM bônus (para taxas diferenciadas).
  const custosTotal=p.custos.reduce((s,c)=>s+c.valor,0);
  const buildFlow=(campo)=>{
    const fm=new Map();const addF=(d,v)=>{const k=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();fm.set(k,(fm.get(k)||0)+v);};
    const vd=p.desembolsos.filter(d=>d.valor>0&&d.data).map(d=>({data:(d.data instanceof Date)?d.data:new Date(d.data+'T00:00:00'),valor:d.valor})).filter(d=>d.data<=venc);
    vd.forEach(({data,valor})=>addF(data,valor));
    if(vd.length){const fd=vd.reduce((mn,d)=>d.data<mn?d.data:mn,vd[0].data);addF(fd,-custosTotal);}
    rows.forEach(s=>{const prest=s[campo];if(prest>0.001)addF(s.data,-prest);});
    const keys=[...fm.keys()].sort((a,b)=>a-b);
    return {cfs:keys.map(k=>fm.get(k)),dts:keys.map(k=>new Date(k))};
  };
  const fSem=buildFlow('totalSem');
  const cetAnual=fSem.cfs.length>2?xirr(fSem.cfs,fSem.dts,0.1):0;           // = planilha (sem bônus)
  const fCom=buildFlow('totalCom');
  const cetAnualComBonus=fCom.cfs.length>2?xirr(fCom.cfs,fCom.dts,0.1):0;   // com bônus de adimplência

  const amortRows=rows.filter(s=>s.principal>0.001);
  return {rows,sched:rows,cd,
    disbDetail:cd.map(x=>({dtLib:x.B,valor:x.C,alloc:x.H,busDays:x.I,juroSem:x.P})),
    qtdPrest:D7,data1a,venc,base,dia,
    totalJurosSem:Math.round(totK*100)/100,totalJurosCom:Math.round(totL*100)/100,
    totalPrincipal:Math.round(totJ*100)/100,totalBonus:Math.round((totK-totL)*100)/100,
    mediaPrestCom:amortRows.length?amortRows.reduce((s,r)=>s+r.totalCom,0)/amortRows.length:0,
    cetAnual,cetMensal:Math.pow(1+cetAnual,1/12)-1,
    cetAnualComBonus,cetMensalComBonus:Math.pow(1+cetAnualComBonus,1/12)-1,custosTotal};
}

function calc(){
  try {
    return runSim({data0:parseDate(S.dataContratacao),valor:+S.valorFin,dia:+S.diaAniv,taxaSem:+S.taxaSem/100,taxaCom:+S.taxaCom/100,prazoAmort:+S.prazoAmort,carencia:+S.carencia,periodPrinc:S.periodPrinc,periodCar:S.periodCar,parcelasIguais:S.parcelasIguais==='SIM',reembolso:S.reembolso||{},desembolsos:S.desembolsos,custos:S.custos});
  } catch(e){ console.error(e); return null; }
}

function validar(){
  const errs=[];
  const car=+S.carencia, pa=+S.prazoAmort, tot=car+pa;
  if(tot>360)errs.push('Prazo total ('+tot+'m) excede 360 meses — a planilha oficial do BNB exibe "prazo total>360m".');
  if(S.periodPrinc!=='PARCELA ÚNICA'){const pm=PERIOD_M[S.periodPrinc]||1;if(pa%pm!==0)errs.push('Prazo de amortização ('+pa+'m) não é múltiplo da periodicidade do principal ('+S.periodPrinc+' = '+pm+'m) — a planilha exibe "erro periodicidade".');}
  if(S.periodCar!=='NENHUMA'&&car>0){const pc=PERIOD_M[S.periodCar]||3;if(car%pc!==0)errs.push('AJUSTAR CARÊNCIA: '+car+'m não é múltiplo da periodicidade de juros na carência ('+S.periodCar+' = '+pc+'m) — mesma validação da planilha oficial do BNB.');}
  if(S.parcelasIguais==='NÃO'&&(!S.reembolso||Object.keys(S.reembolso).length===0))errs.push('Parcelas diferenciadas (NÃO) exigem a tabela de reembolso preenchida — recurso da próxima etapa. Use SIM por enquanto.');
  return errs;
}

    }
    else if(S.viewTab==='memoria'){
      h+=`<div class="note">Juros = Saldo Total × ((1 + taxa)^(dias úteis/252) − 1). Saldo Total inclui juros acumulados na carência.</div><div class="scroll"><table><thead class="purple"><tr><th>MÊS</th><th>DATA</th><th>D.U.</th><th class="r">DESEMB</th><th class="r">JURO MÊS</th><th class="r">JURO PAGO</th><th class="r">PRINC.</th><th class="r">SALDO</th></tr></thead><tbody>`;
      R.sched.filter(s=>s.saldoPrinc>0||s.mes===0||s.totalSem>0).forEach(s=>{h+=`<tr class="${s.disbValor>0?'disb':s.isGrace?'grace':''}" style="border-bottom:1px solid #eee"><td class="c">${s.mes}</td><td>${fmtDate(s.data)}</td><td class="c" style="color:#9ca3af">${s.amd||''}</td><td class="r" style="color:#15803d">${s.disbValor>0?fmt(s.disbValor):''}</td><td class="r">${s.juroMensalSem>0.01?fmt(s.juroMensalSem):''}</td><td class="r" style="color:#dc2626">${s.juroPagoSem>0.01?fmt(s.juroPagoSem):''}</td><td class="r" style="color:#1d4ed8">${s.principal>0.01?fmt(s.principal):''}</td><td class="r"><b>${fmt(s.saldoPrinc)}</b></td></tr>`;});
      h+=`</tbody></table></div>`;
    }
    else if(S.viewTab==='desemb'){
      h+=`<table><thead class="amber"><tr><th>#</th><th>LIBERAÇÃO</th><th class="r">VALOR</th><th>ALOCAÇÃO</th><th class="c">D.U.</th><th class="r">JUROS</th></tr></thead><tbody>`;
      R.disbDetail.forEach((d,i)=>{h+=`<tr style="border-bottom:1px solid #eee"><td class="c">${i+1}</td><td>${fmtDate(d.dtLib)}</td><td class="r">${fmt(d.valor)}</td><td>${fmtDate(d.alloc)}</td><td class="c">${d.busDays}</td><td class="r">${fmt(d.juroSem)}</td></tr>`;});
      h+=`</tbody></table>`;
    }
  }
  h+=`</div>`;
  document.getElementById('app').innerHTML = h;
}
render();
</script>
</body>
</html>
