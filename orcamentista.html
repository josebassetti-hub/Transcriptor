<style>

  .container { max-width: 860px; margin: 0 auto; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.1); border: 1px solid #e5e7eb; }

  .header h1 { font-size: 18px; }
  .header p { font-size: 11px; opacity: .85; }
  .modenav { display: flex; gap: 4px; padding: 10px 12px 0; flex-wrap: wrap; }
  .modenav button { flex: 1; min-width: 110px; padding: 9px 6px; border: none; border-radius: 8px 8px 0 0; background: #e5e7eb; color: #374151; font-weight: bold; font-size: 12.5px; cursor: pointer; }

  .databadge { background: #ecfdf5; color: #065f46; font-size: 11px; padding: 6px 14px; border-bottom: 1px solid #d1fae5; }

  h2 { font-size: 17px; margin-bottom: 12px; }
  h3 { font-size: 14px; color: #0f766e; margin: 14px 0 8px; }

  .field { margin-bottom: 10px; }

  input.plain, select.plain { border-color: #d1d5db; background: #fff; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }

  .hint { font-size: 11px; color: #0d9488; margin-top: 3px; font-weight: 500; }

  .card { padding: 11px; border-radius: 12px; color: #fff; }

  .card .v { font-size: 17px; font-weight: bold; }

  .card.orange { background: linear-gradient(135deg, #f97316, #dc2626); }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { background: #f1f5f9; text-align: left; padding: 6px 6px; border-bottom: 2px solid #e2e8f0; font-size: 11px; }

  tr.cap td { background: #0f766e; color: #fff; font-weight: bold; font-size: 11.5px; }
  tr.subtot td { background: #ecfdf5; font-weight: bold; }

  .amb-row td input { padding: 5px 6px; font-size: 12.5px; }
  .abc-bar { height: 12px; background: linear-gradient(90deg,#0d9488,#14b8a6); border-radius: 3px; }
  .prem { background: #f8fafc; border-left: 3px solid #0d9488; padding: 8px 10px; font-size: 12px; margin: 6px 0; border-radius: 0 6px 6px 0; }
  .lacuna { border-left-color: #f59e0b; }

  .searchres { position: absolute; z-index: 30; background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; max-height: 260px; overflow-y: auto; width: 100%; box-shadow: 0 8px 20px rgba(0,0,0,.15); }

  .plantwrap { position: relative; border: 2px dashed #cbd5e1; border-radius: 10px; overflow: hidden; background: #f8fafc; }
  #plantcv { width: 100%; display: block; touch-action: none; cursor: crosshair; }

  #printdoc { display: none; }

function ambStats(){
  const a = { area:0, per:0, luz:0, int_:0, tug:0, chuveiros:0, bacias:0, lavatorios:0,
    pias:0, tanques:0, ralos:0, registros:0, zonasMolhadas:0, ptAgua:0, ptEsgSec:0,
    janelasM2:0, portasInt:0, cxGordura:0, rodape:0, molhadaM2:0, distQextra:0, ramaisM:0, coletorM:0,
    nAmb:S.ambientes.length };
  const pd = par('pe_direito_m');
  S.ambientes.forEach(m=>{
    const t = AMB[m.tipo]||AMB.outro, area=+m.area||0, per=+m.per||(4*Math.sqrt(area));
    a.area+=area; a.per+=per;
    a.luz+=t.luz; a.int_+=t.int;
    a.tug += t.tug_por_perimetro>0 ? Math.max(t.tug_min, Math.ceil(per/t.tug_por_perimetro)) : t.tug_min;
    a.chuveiros+=t.chuveiro||0; a.bacias+=t.bacia||0; a.lavatorios+=t.lavatorio||0;
    a.pias+=t.pia||0; a.tanques+=t.tanque||0; a.ralos+=t.ralo||0; a.registros+=t.registro||0;
    if(t.cx_gordura) a.cxGordura=1;
    if(t.molhado){ a.zonasMolhadas++; a.ramaisM+=(+m.distP||P.dist_default_ramal_hidraulico_m); }
    if(m.tipo==='banheiro'||m.tipo==='lavabo'){ a.coletorM+=(+m.distP||4); a.molhadaM2+=per*P.altura_revest_parede_molhada_m; }
    if(m.tipo==='cozinha'||m.tipo==='area_servico') a.molhadaM2+=Math.min(per*0.45,6)*P.altura_meia_parede_cozinha_m;
    if(['sala','quarto','escritorio'].includes(m.tipo)) a.janelasM2+=area/6;
    if(['banheiro','lavabo','area_servico','cozinha'].includes(m.tipo)) a.janelasM2+=(m.tipo==='cozinha'?1.2:0.6);
    if(['quarto','banheiro','lavabo','escritorio','despensa'].includes(m.tipo)) a.portasInt++;
    if(!t.molhado) a.rodape+=Math.max(per-P.largura_porta_padrao_m,0);
    const dq=+m.distQ||0, raio=P.raio_cobertura_ponto_eletrico_m;
    if(dq>raio) a.distQextra+=(dq-raio);
  });
  // pontos hidráulicos AF por peça: lavatórios+pias+tanques+bacias(caixa)
  a.ptAgua = a.lavatorios+a.pias+a.tanques+a.bacias;
  a.ptEsgSec = a.lavatorios+a.pias+a.tanques;
  a.registros += 1; // registro geral (barrilete)
  return a;
}

  const paredesLen = rnd1((st.per+perExt)/2);
  const paredesM2 = rnd1(paredesLen*pd);
  const nColunas = Math.max(1,Math.ceil(st.zonasMolhadas/2));
  const circuitos = Math.ceil(st.area/CIRC.iluminacao_area_max_m2)+Math.ceil(st.area/CIRC.tug_area_max_m2)
    +CIRC.circuito_dedicado_cozinha_as+st.chuveiros+CIRC.reserva;
  const telhaFator = S.obra.padrao==='popular'?P.fator_area_telhado_fibrocimento:P.fator_area_telhado_ceramica;
  const vaosVerga = st.portasInt+2 /*externas*/ + Math.round(st.janelasM2/1.5);
  return { st, pd, areaConstr, pav, footprint, perExt, paredesLen, paredesM2, nColunas, circuitos,
    telhaFator, vaosVerga,
    distQM:+S.med.quadroMedidor||P.dist_default_quadro_medidor_m,
    distEsgExt:+S.med.esgotoExterno||P.dist_default_esgoto_externo_m };
}

function extrasDinamicos(c){

// ---------- montagem do orçamento ----------
function precoDe(c){ const s=SVC[c]; if(!s) return 0; return S.precos[c]!==undefined?+S.precos[c]:s.p; }
function calcItens(){
  const c = buildCtx(); const rows=[];
  MAPA.grupos.forEach(g=>{
    if(g.condicional==='sem_rede_esgoto' && S.obra.redeEsgoto) return;
    if(S.obra.incluirEstrutura===false && ['escavacao_fund','fund_concreto','fund_forma','fund_armadura','imperm_baldrame','super_concreto','super_forma','super_armadura','laje'].includes(g.id)) return;
    const ov = S.ov[g.id]||{};
    let code = ov.c!==undefined?ov.c:g.itens[S.obra.padrao];
    if(code===null||code===undefined||code==='') return;
    const r = REGRAS[g.regra]?REGRAS[g.regra](c):{q:0,f:'?'};
    let qtd = ov.qtd!==undefined&&ov.qtd!==''?+ov.qtd:r.q;
    if(!(qtd>0)) return;
    String(code).split('+').forEach(cd=>{
      const s=SVC[cd]; if(!s) return;
      rows.push({grupo:g.id, nome:g.nome, c:cd, d:s.d, u:s.u, qtd, pu:precoDe(cd),
        f:r.f+(ov.qtd!==undefined&&ov.qtd!==''?' (ajustado manualmente)':''), cap:cd.slice(0,2), manual:false});
    });
  });
  extrasDinamicos(c).forEach(x=>{
    const s=SVC[x.c]; if(!s) return;
    rows.push({grupo:x.grupo, nome:x.nome, c:x.c, d:s.d, u:s.u, qtd:x.qtd, pu:precoDe(x.c), f:x.f, cap:x.c.slice(0,2), manual:false});
  });
  S.extras.forEach((x,i)=>{
    const s=SVC[x.c]; if(!s||!(+x.qtd>0)) return;
    rows.push({grupo:'extra'+i, nome:'Item adicional', c:x.c, d:s.d, u:s.u, qtd:+x.qtd, pu:precoDe(x.c),
      f:x.obs||'incluído manualmente', cap:x.c.slice(0,2), manual:true, xi:i});
  });
  rows.forEach(r=>{ r.total = r.qtd*r.pu; });
  return {ctx:c, rows};
}
function totais(rows){
  const cd = sum(rows.map(r=>r.total));
  const bdi = (+S.obra.bdi||0)/100;
  return { cd, bdi, comBdi: cd*(1+bdi) };
}
function premissas(ctx){
  const p=[], PT=INDICES.premissas_texto;
  p.push(PT.padrao); p.push(PT.escala);
  if(S.obra.semEle) p.push(PT.sem_projeto_eletrico);
  if(S.obra.semHid) p.push(PT.sem_projeto_hidraulico);
  if(S.obra.semEst && S.obra.incluirEstrutura) p.push(PT.sem_projeto_estrutural);
  if(S.obra.padrao==='popular') p.push('Padrão popular: sem forro de gesso e sem emassamento (pintura direto no reboco selado).');
  p.push(`Pé-direito adotado: ${par('pe_direito_m')} m. Portas ${P.largura_porta_padrao_m}×${P.altura_porta_padrao_m} m. Vãos ≤ 2 m² não descontados da alvenaria (critério de medição).`);
  p.push(S.obra.redeEsgoto?'Esgoto lançado em rede pública existente.':'Sem rede pública de esgoto: previsto conjunto fossa séptica + filtro anaeróbio.');
  if(!S.obra.incluirEstrutura) p.push('Estrutura EXCLUÍDA do orçamento a pedido (será orçada com projeto estrutural).');
  p.push(`BDI aplicado: ${fmt1(+S.obra.bdi||0)}% sobre o custo direto da tabela DER-ES (tabela publicada com BDI 0).`);
  return p;
}
function lacunas(){
  const l=[];
  if(S.obra.semEle) l.push('Projeto elétrico não fornecido — pontos por mínimos NBR 5410 e distâncias medidas/estimadas.');
  if(S.obra.semHid) l.push('Projeto hidrossanitário não fornecido — traçados estimados pela escala.');
  if(S.obra.semEst) l.push('Projeto estrutural não fornecido — estrutura por índices paramétricos (±20%).');
  if(!S.med.escalaNota) l.push('Planta sem calibração de escala registrada nesta sessão — distâncias digitadas/premissa.');
  return l;
}

function itemSelect(g,cur){
  const ov=S.ov[g.id]||{};
  const sub = cur?cur.slice(0,4):null;
  const base = g.itens[S.obra.padrao];
  const opts = new Set();
  Object.values(g.itens).forEach(v=>{ if(v) String(v).split('+')[0] && opts.add(String(v)); });
  if(cur) BASE_DER.servicos.filter(s=>s.sub===sub).slice(0,40).forEach(s=>opts.add(s.c));
  let h=`<select class="item-sel plain" onchange="setOv('${g.id}','c',this.value===' auto'?'':this.value)">`;
  h+=`<option value=" auto" ${ov.c===undefined?'selected':''}>auto (padrão): ${base?esc(base):'—'}</option>`;
  [...opts].forEach(c=>{
    const s=SVC[String(c).split('+')[0]];
    h+=`<option value="${esc(c)}" ${ov.c===c?'selected':''}>${esc(c)} — ${s?esc(s.d.slice(0,52)):''}</option>`;
  });
  return h+`</select>`;
}
let buscaTimer=null;
function buscaSvc(q){
  clearTimeout(buscaTimer);
  buscaTimer=setTimeout(()=>{
    const el=document.getElementById('buscares');
    q=(q||'').trim().toLowerCase();
    if(q.length<3){ el.innerHTML=''; return; }
    const toks=q.split(/\s+/);
    const res=BASE_DER.servicos.filter(s=>{ const d=(s.c+' '+s.d).toLowerCase(); return toks.every(t=>d.includes(t)); }).slice(0,25);
    el.innerHTML=`<div class="searchres">${res.map(s=>`<div onclick="addExtra('${s.c}');document.getElementById('busca').value=''">${esc(s.c)} · ${esc(s.d.slice(0,90))} <b>(${esc(s.u)} · R$ ${fmt(s.p)})</b></div>`).join('')||'<div>nenhum resultado</div>'}</div>`;

}

// ---------- planta: calibração e medição ----------
let plantImg=null, plantScale=null, plantMode=null, plantPts=[];
function plantaBind(){
  const f=document.getElementById('plantfile'), cv=document.getElementById('plantcv');
  if(!f||!cv) return;
  f.onchange=()=>{ const file=f.files[0]; if(!file) return;
    const r=new FileReader(); r.onload=e=>{ const im=new Image(); im.onload=()=>{ plantImg=im; plantScale=null; plantDraw(); }; im.src=e.target.result; }; r.readAsDataURL(file); };
  document.getElementById('btncal').onclick=()=>{ plantMode='cal'; plantPts=[]; plantStat('clique nos 2 extremos da cota conhecida'); };
  document.getElementById('btnmed').onclick=()=>{ plantMode='med'; plantPts=[]; plantStat(plantScale?'clique em 2 pontos p/ medir':'calibre a escala primeiro'); };
  cv.onpointerdown=ev=>{
    if(!plantImg||!plantMode) return;
    const r=cv.getBoundingClientRect();
    const x=(ev.clientX-r.left)*cv.width/r.width, y=(ev.clientY-r.top)*cv.height/r.height;
    plantPts.push([x,y]); plantDraw();
    if(plantPts.length===2){
      const dpx=Math.hypot(plantPts[1][0]-plantPts[0][0], plantPts[1][1]-plantPts[0][1]);
      if(plantMode==='cal'){
        const m=parseFloat((prompt('Quantos METROS tem essa cota? (ex.: 3.50)')||'').replace(',','.'));
        if(m>0){ plantScale=dpx/m; S.med.escalaNota=(S.med.escalaNota?S.med.escalaNota+'; ':'')+`cota ${fmt(m)}m calibrada`; plantStat(`escala: ${fmt(plantScale)} px/m`); }
      } else if(plantScale){
        const met=dpx/plantScale;
        document.getElementById('plantdist').textContent=`medido: ${fmt(met)} m`;
        const tgt=document.getElementById('aplicarem').value;
        if(tgt==='quadroMedidor'){ S.med.quadroMedidor=rnd1(met); }
        else if(tgt==='esgotoExterno'){ S.med.esgotoExterno=rnd1(met); }
        else if(tgt.startsWith('dq')){ S.ambientes[+tgt.slice(2)].distQ=rnd1(met); }
        else if(tgt.startsWith('dp')){ S.ambientes[+tgt.slice(2)].distP=rnd1(met); }
        if(tgt){ render(); return; }
      }
      plantPts=[];
      setTimeout(plantDraw,600);
    }
  };
  plantDraw();
}
function plantStat(t){ const el=document.getElementById('plantstat'); if(el) el.textContent=t; }
function plantDraw(){
  const cv=document.getElementById('plantcv'); if(!cv) return;
  const ctx=cv.getContext('2d');
  if(!plantImg){ cv.width=800; cv.height=140; ctx.fillStyle='#f8fafc'; ctx.fillRect(0,0,800,140);
    ctx.fillStyle='#94a3b8'; ctx.font='15px Arial'; ctx.textAlign='center';
    ctx.fillText('carregue a imagem da planta para calibrar a escala e medir', 400, 75); return; }
  const W=Math.min(plantImg.width,1400), H=plantImg.height*W/plantImg.width;
  cv.width=W; cv.height=H; ctx.drawImage(plantImg,0,0,W,H);
  ctx.fillStyle='#dc2626'; ctx.strokeStyle='#dc2626'; ctx.lineWidth=3;
  plantPts.forEach(p=>{ ctx.beginPath(); ctx.arc(p[0],p[1],6,0,7); ctx.fill(); });
  if(plantPts.length===2){ ctx.beginPath(); ctx.moveTo(...plantPts[0]); ctx.lineTo(...plantPts[1]); ctx.stroke(); }
}

// ---------- import/export ----------
function orcamentoJSON(){
  const {ctx, rows} = calcItens(); const T=totais(rows);
  return {
    app:'orcamentista-der-es', versao:1,
    obra:{...S.obra, data_base:BASE_DER.meta.data_base},
    ambientes:S.ambientes, medicoes:S.med, parametros:S.par,
    itens:rows.map(r=>({grupo:r.grupo, c:r.c, d:r.d, u:r.u, qtd:r.qtd, pu:r.pu, total:r.total, formula:r.f, manual:!!r.manual})),
    overrides:S.ov, extras:S.extras, precos:S.precos,
    totais:{custo_direto:T.cd, bdi_pct:+S.obra.bdi||0, total:T.comBdi},
    premissas:premissas(ctx), lacunas:lacunas()
  };
}
function exportJSON(){
  const blob=new Blob([JSON.stringify(orcamentoJSON(),null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='orcamento-'+(S.obra.nome||'obra').toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,40)+'.json'; a.click();
}
function importJSON(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=e=>{ try{
    const j=JSON.parse(e.target.result);
    if(j.obra) Object.assign(S.obra, j.obra);
    if(Array.isArray(j.ambientes)) S.ambientes=j.ambientes;
    if(j.medicoes) Object.assign(S.med, j.medicoes);
    if(j.overrides) S.ov=j.overrides;
    if(Array.isArray(j.extras)) S.extras=j.extras;
    if(j.precos) S.precos=j.precos;
    if(j.parametros) S.par=j.parametros;
    render();
  }catch(err){ alert('JSON inválido: '+err.message); } };
  r.readAsText(f);
}
function exportCSV(){

// ---------- estado na URL (#d=) ----------
function encodeEstado(){
  const diff={};
  ['obra','med','ov','extras','precos','par'].forEach(k=>{
    if(JSON.stringify(S[k])!==JSON.stringify(DEF[k])) diff[k]=S[k];
  });
  if(JSON.stringify(S.ambientes)!==JSON.stringify(DEF.ambientes))
    diff.a9=S.ambientes.map(m=>[m.nome,m.tipo,m.area,m.per,m.distQ,m.distP]);
  const json=JSON.stringify(diff);
  return btoa(unescape(encodeURIComponent(json))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function decodeEstado(b64){
  try{
    const json=decodeURIComponent(escape(atob(b64.replace(/-/g,'+').replace(/_/g,'/'))));
    const diff=JSON.parse(json);
    ['obra','med','ov','extras','precos','par'].forEach(k=>{ if(diff[k]) S[k]=Object.assign(Array.isArray(DEF[k])?[]:{}, JSON.parse(JSON.stringify(DEF[k])), diff[k]); });
    if(Array.isArray(diff.a9)) S.ambientes=diff.a9.map(x=>({nome:String(x[0]),tipo:String(x[1]),area:+x[2]||0,per:+x[3]||0,distQ:+x[4]||0,distP:+x[5]||0}));
    return true;
  }catch(e){ console.warn('hash inválido',e); return false; }
}
function linkAtual(){ return location.href.split('#')[0]+'#d='+encodeEstado(); }
function copiarLink(){
  const url=linkAtual();
  const done=()=>{ const el=document.getElementById('copiado'); if(el){el.textContent='✅ Link copiado!'; setTimeout(()=>{el.textContent='';},2500);} };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(done).catch(()=>prompt('Copie o link:',url)); }
  else prompt('Copie o link:',url);
}

// ---------- QR encoder (byte mode, ECC L, v1–9, máscara 0 — sem libs) ----------
const QR_CAP={1:19,2:34,3:55,4:80,5:108,6:136,7:156,8:194,9:232};
const QR_EC ={1:7,2:10,3:15,4:20,5:26,6:18,7:20,8:24,9:30};
const QR_NB ={1:1,2:1,3:1,4:1,5:1,6:2,7:2,8:2,9:2};
const QR_ALIGN={2:[6,18],3:[6,22],4:[6,26],5:[6,30],6:[6,34],7:[6,22,38],8:[6,24,42],9:[6,26,46]};
const GF_EXP=new Array(512), GF_LOG=new Array(256);
(function(){ let x=1; for(let i=0;i<255;i++){ GF_EXP[i]=x; GF_LOG[x]=i; x<<=1; if(x&0x100)x^=0x11d; } for(let i=255;i<512;i++)GF_EXP[i]=GF_EXP[i-255]; })();
const gmul=(a,b)=>(a===0||b===0)?0:GF_EXP[GF_LOG[a]+GF_LOG[b]];
function rsGen(n){ let g=[1]; for(let i=0;i<n;i++){ const ng=new Array(g.length+1).fill(0);
  for(let j=0;j<g.length;j++){ ng[j]^=g[j]; ng[j+1]^=gmul(g[j],GF_EXP[i]); } g=ng; } return g; }
function rsEncode(data,n){ const g=rsGen(n), res=data.concat(new Array(n).fill(0));
  for(let i=0;i<data.length;i++){ const c=res[i]; if(c===0)continue;
    for(let j=0;j<g.length;j++)res[i+j]^=gmul(g[j],c); }
  return res.slice(data.length); }
function bch(val,poly,bits){ const msb=(x)=>{let m=0;while(x>>m)m++;return m;};
  let d=val<<bits, pm=msb(poly);
  while(msb(d)>=pm){ d^=poly<<(msb(d)-pm); }
  return (val<<bits)|d; }
function qrMatrix(text){
  const bytes=[]; new TextEncoder().encode(text).forEach(b=>bytes.push(b));
  let v=null; for(let i=1;i<=9;i++){ if(bytes.length+2<=QR_CAP[i]){ v=i; break; } }
  if(!v)return null;
  const cap=QR_CAP[v], nb=QR_NB[v], ecn=QR_EC[v], size=17+4*v;
  const bits=[]; const put=(val,n)=>{ for(let i=n-1;i>=0;i--)bits.push((val>>i)&1); };
  put(4,4); put(bytes.length,8); bytes.forEach(b=>put(b,8));
  const totalBits=cap*8;
  put(0,Math.min(4,totalBits-bits.length));
  while(bits.length%8)bits.push(0);
  const pads=[0xEC,0x11]; let pi=0;
  while(bits.length<totalBits){ put(pads[pi%2],8); pi++; }
  const data=[]; for(let i=0;i<bits.length;i+=8){ let b=0; for(let j=0;j<8;j++)b=(b<<1)|bits[i+j]; data.push(b); }
  const per=cap/nb, blocks=[], ecs=[];
  for(let b=0;b<nb;b++){ const d=data.slice(b*per,(b+1)*per); blocks.push(d); ecs.push(rsEncode(d,ecn)); }
  const seq=[];
  for(let i=0;i<per;i++)for(let b=0;b<nb;b++)seq.push(blocks[b][i]);
  for(let i=0;i<ecn;i++)for(let b=0;b<nb;b++)seq.push(ecs[b][i]);
  const M=Array.from({length:size},()=>new Array(size).fill(null));
  const setF=(r,c,val)=>{ if(r>=0&&r<size&&c>=0&&c<size)M[r][c]=val; };
  const finder=(r,c)=>{ for(let i=-1;i<8;i++)for(let j=-1;j<8;j++){ const rr=r+i,cc=c+j;
    if(rr<0||rr>=size||cc<0||cc>=size)continue;
    const on=(i>=0&&i<=6&&j>=0&&j<=6)&&(i===0||i===6||j===0||j===6||(i>=2&&i<=4&&j>=2&&j<=4));
    M[rr][cc]=on?1:0; } };
  finder(0,0); finder(0,size-7); finder(size-7,0);
  for(let i=8;i<size-8;i++){ if(M[6][i]===null)M[6][i]=(i%2===0)?1:0; if(M[i][6]===null)M[i][6]=(i%2===0)?1:0; }
  (QR_ALIGN[v]||[]).forEach(r=>{(QR_ALIGN[v]||[]).forEach(c=>{
    if((r<=8&&c<=8)||(r<=8&&c>=size-9)||(r>=size-9&&c<=8))return;
    for(let i=-2;i<=2;i++)for(let j=-2;j<=2;j++)
      setF(r+i,c+j,(Math.max(Math.abs(i),Math.abs(j))!==1)?1:0);
  });});
  M[size-8][8]=1;
  for(let i=0;i<9;i++){ if(M[8][i]===null)M[8][i]=0; if(M[i][8]===null)M[i][8]=0; }
  for(let i=size-8;i<size;i++){ if(M[8][i]===null)M[8][i]=0; if(M[i][8]===null)M[i][8]=0; }
  if(v>=7){ for(let i=0;i<6;i++)for(let j=size-11;j<size-8;j++){ M[i][j]=0; M[j][i]=0; } }
  let bi=0; const dataBits=[]; seq.forEach(b=>{ for(let i=7;i>=0;i--)dataBits.push((b>>i)&1); });
  let col=size-1, up=true;
  while(col>0){
    if(col===6)col--;
    for(let k=0;k<size;k++){
      const r=up?size-1-k:k;
      for(const c of [col,col-1]){
        if(M[r][c]!==null)continue;
        let bit=bi<dataBits.length?dataBits[bi]:0; bi++;
        if((r+c)%2===0)bit^=1;
        M[r][c]=bit;
      }
    }
    col-=2; up=!up;
  }
  const fmtb=bch(0b01000,0b10100110111,10)^0b101010000010010;
  const fb=i=>(fmtb>>(14-i))&1;
  for(let i=0;i<6;i++)M[8][i]=fb(i);
  M[8][7]=fb(6); M[8][8]=fb(7); M[7][8]=fb(8);
  for(let i=9;i<15;i++)M[14-i][8]=fb(i);
  for(let i=0;i<7;i++)M[size-1-i][8]=fb(i);
  for(let i=7;i<15;i++)M[8][size-15+i]=fb(i);
  if(v>=7){ const vi=bch(v,0b1111100100101,12);
    for(let i=0;i<18;i++){ const bit=(vi>>i)&1;
      M[Math.floor(i/3)][size-11+(i%3)]=bit;
      M[size-11+(i%3)][Math.floor(i/3)]=bit; }
  }
  return M;
}
function qrSVG(text){
  const M=qrMatrix(text);
  if(!M)return null;
  const size=M.length, Q=4, T=size+Q*2;
  let s=`<svg viewBox="0 0 ${T} ${T}" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect width="${T}" height="${T}" fill="#fff"/>`;
  for(let r=0;r<size;r++)for(let c=0;c<size;c++)if(M[r][c]===1)s+=`<rect x="${c+Q}" y="${r+Q}" width="1" height="1" fill="#000"/>`;
  return s+'</svg>';
}

// ---------- impressão A4 ----------
function imprimir(){
  const {ctx, rows}=calcItens(); const T=totais(rows); const m2=(+S.obra.area||1);
  const porCap={}; rows.forEach(r=>{ (porCap[r.cap]=porCap[r.cap]||[]).push(r); });
  let h=`<div class="ppage"><div class="pcapa">
    <div style="font-size:38px">🏗️</div><h1>Orçamento de Obra</h1>
    <div class="sub">${esc(S.obra.nome)}</div><div class="sub">${esc(S.obra.local)} · padrão ${esc(S.obra.padrao)} · ${fmt1(+S.obra.area||0)} m²</div>
    <div class="sub" style="margin-top:16px">Tabela Referencial DER-ES · data-base ${esc(BASE_DER.meta.data_base)}</div>
    <div class="sub">Total estimado: <b>R$ ${fmt(T.comBdi)}</b> (R$ ${fmt(T.comBdi/m2)}/m²) · BDI ${fmt1(+S.obra.bdi||0)}%</div>
  </div><div class="prodape">Estudo indicativo por metodologia paramétrica — não substitui orçamento executivo. Gerado offline pelo Orçamentista DER-ES.</div></div>`;
  // planilha
  h+=`<div class="ppage"><h2>Planilha orçamentária</h2><table><tr><th>Código</th><th>Especificação</th><th>Und</th><th class="num">Qtd</th><th class="num">PU c/ BDI</th><th class="num">Total</th></tr>`;
  Object.keys(porCap).sort().forEach(cap=>{
    const rs=porCap[cap].sort((a,b)=>a.c.localeCompare(b.c));
    h+=`<tr style="background:#f1f5f9;font-weight:bold"><td colspan="5">${esc(cap)} — ${esc(CAPS[cap]||'')}</td><td class="num">${fmt(sum(rs.map(r=>r.total))*(1+T.bdi))}</td></tr>`;
    rs.forEach(r=>{ h+=`<tr><td>${esc(r.c)}</td><td>${esc(r.d.slice(0,90))}</td><td>${esc(r.u)}</td><td class="num">${fmt(r.qtd)}</td><td class="num">${fmt(r.pu*(1+T.bdi))}</td><td class="num">${fmt(r.total*(1+T.bdi))}</td></tr>`; });
  });
  h+=`<tr style="font-weight:bold;background:#ecfdf5"><td colspan="5">TOTAL GERAL (custo direto R$ ${fmt(T.cd)} + BDI ${fmt1(+S.obra.bdi||0)}%)</td><td class="num">R$ ${fmt(T.comBdi)}</td></tr></table></div>`;
  // memorial
  h+=`<div class="ppage"><h2>Premissas e lacunas</h2>`;
  premissas(ctx).forEach(p=>h+=`<div style="margin:4px 0">• ${esc(p)}</div>`);
  const lac=lacunas(); if(lac.length){ h+=`<h2>Lacunas</h2>`; lac.forEach(l=>h+=`<div style="margin:4px 0">⚠️ ${esc(l)}</div>`); }
  h+=`<h2>Memória de cálculo</h2><table><tr><th>Item</th><th>Fórmula</th><th class="num">Qtd</th></tr>`;
  rows.forEach(r=>{ h+=`<tr><td>${esc(r.c)} ${esc(r.d.slice(0,55))}</td><td>${esc(r.f)}</td><td class="num">${fmt(r.qtd)} ${esc(r.u)}</td></tr>`; });
  h+=`</table><div class="passin"><div class="l">Responsável técnico</div><div class="l">Cliente</div></div>
  <div class="prodape">Orçamentista DER-ES · ${esc(BASE_DER.meta.data_base)} · valores indicativos, sujeitos a revisão com projetos executivos.</div></div>`;
  document.getElementById('printdoc').innerHTML=h;
  window.print();
}

// ---------- autoteste ----------
const GOLD = {/*GOLD_START*/pontosLuz:7, pontosTomada:19, custoDireto:183464.48/*GOLD_END*/};
function runAutoteste(){
  const out=[]; const ok=(nome,got,want,tol)=>{ const pass=Math.abs(got-want)<=(tol??0.011);
    out.push(`<div class="${pass?'t-ok':'t-fail'}">${pass?'✅':'❌'} ${nome}: ${typeof got==='number'?fmt(got):got}${pass?'':' (esperado '+(typeof want==='number'?fmt(want):want)+')'}</div>`); return pass; };
  const bak=JSON.stringify({o:S.obra,a:S.ambientes,m:S.med,ov:S.ov,x:S.extras,p:S.precos,pa:S.par});
  S.obra=defState().obra; S.ambientes=demoAmbientes(); S.med=defState().med; S.ov={}; S.extras=[]; S.precos={}; S.par={};
  try{
    // 1) sanidade da base embutida
    ok('base: nº de serviços', BASE_DER.servicos.length, 1340, 0);
    ok('base: preço 140701 (pt água fria)', SVC['140701'].p, 112.49, 0.001);
    ok('base: preço 151801 (pt luz teto)', SVC['151801'].p, 238.03, 0.001);
    // 2) take-off do exemplo dourado
    const st=ambStats();
    ok('pontos de luz (7 amb)', st.luz, GOLD.pontosLuz, 0);
    ok('tomadas NBR 5410', st.tug, GOLD.pontosTomada, 0);
    ok('bacias', st.bacias, 1, 0); ok('zonas molhadas', st.zonasMolhadas, 3, 0);
    // 3) motor completo — regressão do total
    const {rows}=calcItens(); const T=totais(rows);
    rows.forEach(r=>{ if(!(r.qtd>0)||!(r.pu>0)) out.push(`<div class="t-fail">❌ item degenerado: ${r.c} qtd=${r.qtd} pu=${r.pu}</div>`); });
    if(GOLD.custoDireto!==null) ok('custo direto (regressão)', T.cd, GOLD.custoDireto, 0.5);
    else out.push(`<div>ℹ️ custo direto atual: R$ ${fmt(T.cd)} (grave em GOLD.custoDireto)</div>`);
    ok('BDI aplica corretamente', totais(rows).comBdi, T.cd*1.25, 0.02);
    // 4) codec de estado: encode→decode→encode idêntico
    S.obra.nome='Teste codec'; S.ambientes[0].area=17.5;
    const e1=encodeEstado(); const Sb=JSON.stringify(S.obra)+JSON.stringify(S.ambientes);
    S.obra=defState().obra; S.ambientes=demoAmbientes();
    decodeEstado(e1);
    const pass=(JSON.stringify(S.obra)+JSON.stringify(S.ambientes))===Sb;
    out.push(`<div class="${pass?'t-ok':'t-fail'}">${pass?'✅':'❌'} codec #d= (ida e volta)</div>`);
    // 5) QR
    const q=qrMatrix('https://exemplo.com/#d=teste');
    out.push(`<div class="${q&&q.length>=21?'t-ok':'t-fail'}">${q&&q.length>=21?'✅':'❌'} QR: matriz ${q?q.length+'×'+q.length:'falhou'}</div>`);
  }catch(e){ out.push(`<div class="t-fail">❌ exceção: ${esc(e.message)}</div>`); }
  const b=JSON.parse(bak); S.obra=b.o; S.ambientes=b.a; S.med=b.m; S.ov=b.ov; S.extras=b.x; S.precos=b.p; S.par=b.pa;
  render();
  const el=document.getElementById('autoteste'); if(el) el.innerHTML=out.join('');
  else { S.mode='cfg'; render(); document.getElementById('autoteste').innerHTML=out.join(''); }
}
