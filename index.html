<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proposta FNE · Simulador BNB</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, -apple-system, sans-serif; background: #f0f2f5; padding: 16px; color: #1a1a1a; }
  .container { max-width: 720px; margin: 0 auto; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.1); border: 1px solid #e5e7eb; }
  .header { background: linear-gradient(90deg, #1e40af, #2563eb); color: #fff; padding: 16px; display: flex; align-items: center; gap: 12px; }
  .header .icon { width: 40px; height: 40px; background: rgba(255,255,255,.2); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .header h1 { font-size: 18px; }
  .header p { font-size: 11px; opacity: .8; }
  .progress { padding: 12px 16px 0; display: flex; gap: 4px; }
  .progress .seg { flex: 1; }
  .progress .bar { height: 6px; border-radius: 3px; background: #e5e7eb; }
  .progress .bar.active { background: #2563eb; }
  .progress .lbl { font-size: 11px; margin-top: 4px; color: #9ca3af; }
  .progress .lbl.active { color: #1d4ed8; font-weight: bold; }
  .body { padding: 16px; }
  h2 { font-size: 18px; margin-bottom: 16px; }
  h3 { font-size: 14px; color: #1e40af; margin: 12px 0 8px; }
  label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 4px; }
  .field { margin-bottom: 12px; }
  input, select { width: 100%; padding: 8px 12px; border: 2px solid #facc15; border-radius: 8px; background: #fefce8; font-size: 14px; font-weight: 500; }
  input.blue { border-color: #60a5fa; background: #eff6ff; }
  input.plain, select.plain { border-color: #d1d5db; background: #fff; }
  input:focus, select:focus { outline: none; box-shadow: 0 0 0 2px #3b82f6; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .hint { font-size: 11px; color: #2563eb; margin-top: 4px; font-weight: 500; }
  .infobox { background: #eff6ff; border-radius: 8px; padding: 8px 12px; font-size: 12px; color: #1d4ed8; margin-bottom: 12px; }
  .summary { background: #eff6ff; border-radius: 8px; padding: 12px; font-size: 14px; }
  .summary .row { display: flex; justify-content: space-between; padding: 2px 0; }
  .btns { display: flex; justify-content: space-between; margin-top: 16px; }
  .btn { padding: 10px 24px; border-radius: 8px; font-weight: bold; font-size: 14px; border: none; cursor: pointer; }
  .btn.primary { background: #2563eb; color: #fff; box-shadow: 0 4px 6px rgba(37,99,235,.3); }
  .btn.primary:hover { background: #1d4ed8; }
  .btn.gray { background: #e5e7eb; color: #374151; }
  .btn.gray:hover { background: #d1d5db; }
  .btn.green { background: #16a34a; color: #fff; box-shadow: 0 4px 6px rgba(22,163,74,.3); }
  .btn.green:hover { background: #15803d; }
  .desemb-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .desemb-row .num { font-size: 11px; color: #9ca3af; width: 20px; }
  .desemb-row input { padding: 6px 8px; font-size: 13px; }
  .valid { margin-top: 12px; padding: 8px; border-radius: 8px; font-size: 14px; font-weight: bold; }
  .valid.ok { background: #dcfce7; color: #166534; }
  .valid.err { background: #fee2e2; color: #991b1b; }
  .cost-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .cost-row input:first-child { flex: 1; }
  .cost-row input:last-child { width: 144px; text-align: right; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .card { padding: 12px; border-radius: 12px; color: #fff; }
  .card .t { font-size: 11px; opacity: .8; }
  .card .v { font-size: 18px; font-weight: bold; }
  .card.blue { background: linear-gradient(135deg, #2563eb, #1e40af); }
  .card.green { background: linear-gradient(135deg, #16a34a, #166534); }
  .card.purple { background: linear-gradient(135deg, #9333ea, #6b21a8); }
  .card.orange { background: linear-gradient(135deg, #f97316, #dc2626); }
  .detail { background: #f9fafb; border-radius: 8px; padding: 12px; font-size: 12px; margin-bottom: 16px; }
  .detail .row { display: flex; justify-content: space-between; padding: 2px 0; }
  .tabs { display: flex; gap: 4px; margin-bottom: 12px; overflow-x: auto; }
  .tab { padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 500; white-space: nowrap; border: none; cursor: pointer; background: #f3f4f6; color: #4b5563; }
  .tab.active { background: #2563eb; color: #fff; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { padding: 4px; }
  td { padding: 2px 4px; }
  thead.blue th { background: #1d4ed8; color: #fff; }
  thead.purple th { background: #6b21a8; color: #fff; }
  thead.amber th { background: #b45309; color: #fff; }
  .th-yellow th { background: #fef9c3; }
  .th-blue th { background: #dbeafe; }
  tr.grace { background: #fefce8; }
  tr.disb { background: #f0fdf4; }
  tr.tot { background: #dcfce7; font-weight: bold; }
  .scroll { overflow-x: auto; max-height: 55vh; }
  .r { text-align: right; }
  .c { text-align: center; }
  .link { font-size: 12px; color: #2563eb; cursor: pointer; text-decoration: underline; background: none; border: none; }
  .editbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .note { font-size: 11px; color: #6b7280; margin-bottom: 8px; }

  /* ===== V2: navegação de modos ===== */
  .modenav { display: flex; gap: 6px; padding: 10px 16px; background: #0f172a; }
  .modenav button { flex: 1; padding: 8px 6px; border-radius: 8px; border: none; cursor: pointer; font-size: 12px; font-weight: bold; background: #1e293b; color: #94a3b8; }
  .modenav button.active { background: #2563eb; color: #fff; }
  .databadge { font-size: 10px; color: #64748b; text-align: right; padding: 4px 16px 0; background: #fff; }

  /* ===== V2: apresentação ===== */
  .apr { padding: 16px; }
  .apr h2 { font-size: 20px; color: #0f172a; }
  .apr .sub { font-size: 13px; color: #475569; margin: 4px 0 14px; }
  .hero { text-align: center; padding: 22px 14px 10px; }
  .hero .pill { display: inline-block; background: #dcfce7; color: #166534; border: 1px solid #86efac; border-radius: 999px; padding: 5px 14px; font-size: 12px; font-weight: bold; margin-bottom: 12px; }
  .hero h2 { font-size: 24px; line-height: 1.25; }
  .hero .sub { font-size: 14px; }
  .checklist { text-align: left; max-width: 430px; margin: 14px auto; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 12px; padding: 12px 16px; }
  .checklist div { padding: 4px 0; font-size: 13.5px; color: #14532d; font-weight: 500; }
  .bignum { text-align: center; margin: 10px 0 2px; }
  .bignum .v { font-size: 40px; font-weight: 800; color: #15803d; letter-spacing: -1px; }
  .bignum .t { font-size: 13px; color: #475569; font-weight: 600; }
  .bignum .d { font-size: 12.5px; color: #64748b; margin-top: 2px; }
  .kpirow { display: grid; grid-template-columns: repeat(2,1fr); gap: 8px; margin: 14px 0; }
  @media (min-width:560px){ .kpirow { grid-template-columns: repeat(4,1fr); } }
  .kpi { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 10px; text-align: center; }
  .kpi .v { font-size: 19px; font-weight: 800; color: #0f172a; }
  .kpi .t { font-size: 10.5px; color: #64748b; font-weight: 600; text-transform: uppercase; letter-spacing: .3px; }
  .kpi.destaque { background: #f0fdf4; border-color: #86efac; }
  .kpi.destaque .v { color: #15803d; }
  .mundos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
  @media (max-width:520px){ .mundos { grid-template-columns: 1fr; } }
  .mundo { border-radius: 14px; padding: 14px; border: 2px solid; }
  .mundo h4 { font-size: 13px; margin-bottom: 8px; }
  .mundo ul { list-style: none; font-size: 12.5px; }
  .mundo li { padding: 3px 0; }
  .mundo.a { background: #fef2f2; border-color: #fecaca; color: #7f1d1d; }
  .mundo.b { background: #f0fdf4; border-color: #86efac; color: #14532d; }
  .deltafinal { text-align: center; background: linear-gradient(135deg,#16a34a,#166534); color: #fff; border-radius: 14px; padding: 14px; margin: 12px 0; }
  .deltafinal .v { font-size: 30px; font-weight: 800; }
  .deltafinal .t { font-size: 12.5px; opacity: .92; }
  .svgbox { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 10px 6px 4px; margin: 10px 0; }
  .svgbox svg { width: 100%; height: auto; display: block; }
  .svgtitle { font-size: 12px; font-weight: bold; color: #334155; padding: 0 8px 6px; }
  .caixabox, .avisobox { border-radius: 12px; padding: 12px 14px; font-size: 12.5px; margin: 10px 0; }
  .caixabox { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e3a8a; }
  .avisobox { background: #fffbeb; border: 1px solid #fde68a; color: #78350f; }
  .esperabox { background: #fff7ed; border: 2px solid #fdba74; border-radius: 14px; padding: 14px; margin: 12px 0; color: #7c2d12; }
  .esperabox .v { font-size: 22px; font-weight: 800; }
  .pacotes { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin: 12px 0; }
  @media (max-width:560px){ .pacotes { grid-template-columns: 1fr; } }
  .pacote { border: 2px solid #e2e8f0; border-radius: 14px; padding: 12px; text-align: center; cursor: pointer; background: #fff; position: relative; }
  .pacote.sel { border-color: #16a34a; background: #f0fdf4; box-shadow: 0 4px 14px rgba(22,163,74,.18); }
  .pacote .star { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: #16a34a; color: #fff; font-size: 10px; font-weight: bold; border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
  .pacote h4 { font-size: 13px; margin: 6px 0 2px; }
  .pacote .pv { font-size: 17px; font-weight: 800; color: #0f172a; }
  .pacote .pd { font-size: 11px; color: #64748b; }
  .semaforo td, .semaforo th { font-size: 11.5px; padding: 5px 6px; border-bottom: 1px solid #f1f5f9; }
  .semaforo th { background: #0f172a; color: #fff; }
  .semaforo td:first-child { font-weight: 600; color: #334155; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: baseline; }
  .dot.g { background: #22c55e; } .dot.y { background: #eab308; } .dot.r { background: #ef4444; }
  .cenpills { display: flex; gap: 6px; margin: 10px 0; }
  .cenpills button { flex: 1; padding: 7px 4px; border-radius: 999px; border: 2px solid #e2e8f0; background: #fff; font-size: 12px; font-weight: bold; color: #475569; cursor: pointer; }
  .cenpills button.active { border-color: #2563eb; background: #eff6ff; color: #1d4ed8; }
  .fraseouro { font-size: 13px; background: #f0fdf4; border-left: 4px solid #16a34a; border-radius: 0 10px 10px 0; padding: 10px 12px; color: #14532d; margin: 8px 0; font-weight: 500; }
  .scqa { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 14px; padding: 14px; font-size: 13px; }
  .scqa p { margin: 6px 0; }
  .scqa b.k { color: #1d4ed8; }
  .passos { counter-reset: p; list-style: none; margin: 10px 0; }
  .passos li { counter-increment: p; display: flex; gap: 10px; padding: 7px 0; font-size: 13px; align-items: baseline; }
  .passos li::before { content: counter(p); background: #2563eb; color: #fff; min-width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; }
  .aprnav { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; gap: 8px; }
  .aprnav .dots { display: flex; gap: 5px; }
  .aprnav .dots span { width: 8px; height: 8px; border-radius: 50%; background: #cbd5e1; cursor: pointer; }
  .aprnav .dots span.on { background: #2563eb; }
  details.acc { border: 1px solid #e2e8f0; border-radius: 10px; padding: 8px 12px; margin: 8px 0; background: #fff; }
  details.acc summary { font-size: 12.5px; font-weight: bold; color: #1d4ed8; cursor: pointer; }
  .disclaimer { font-size: 10.5px; color: #94a3b8; margin-top: 14px; line-height: 1.45; }
  .qrwrap { text-align: center; margin: 10px 0; }
  .qrwrap svg { width: 150px; height: 150px; }
  .regime-expl { font-size: 12.5px; background: #faf5ff; border: 1px solid #e9d5ff; color: #581c87; border-radius: 12px; padding: 12px 14px; margin: 10px 0; }
  .regime-expl b { color: #6b21a8; }
  .parambox { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; margin-bottom: 14px; }
  .parambox h3 { margin-top: 0; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  @media (max-width:520px){ .grid3 { grid-template-columns: 1fr 1fr; } }
  .autoteste { font-size: 12px; }
  .autoteste .t-ok { color: #15803d; }
  .autoteste .t-fail { color: #b91c1c; font-weight: bold; }
  .chip { display: inline-block; font-size: 10.5px; font-weight: bold; border-radius: 999px; padding: 2px 9px; margin: 2px 3px 2px 0; }
  .chip.verde { background: #dcfce7; color: #166534; }
  .chip.azul { background: #dbeafe; color: #1e40af; }

  /* ===== V2: impressão A4 ===== */
  #printdoc { display: none; }
  @media print {
    body { background: #fff; padding: 0; }
    body > .container { display: none; }
    #printdoc { display: block; font-size: 12px; color: #111; }
    .ppage { page-break-after: always; padding: 10mm 2mm; }
    .ppage:last-child { page-break-after: auto; }
    .noprint { display: none !important; }
  }
  #printdoc .pcapa { text-align: center; padding-top: 40mm; }
  #printdoc .pcapa h1 { font-size: 26px; margin: 8px 0; }
  #printdoc .pcapa .sub { font-size: 14px; color: #475569; }
  #printdoc h2 { font-size: 17px; border-bottom: 2px solid #2563eb; padding-bottom: 4px; margin: 14px 0 10px; }
  #printdoc .prodape { font-size: 9.5px; color: #64748b; border-top: 1px solid #e2e8f0; margin-top: 12px; padding-top: 6px; }
</style>
</head>

    rows.forEach(s=>{const prest=s[campo];if(prest>0.001)addF(s.data,-prest);});
    const keys=[...fm.keys()].sort((a,b)=>a-b);
    return {cfs:keys.map(k=>fm.get(k)),dts:keys.map(k=>new Date(k))};
  };
  const fSem=buildFlow('totalSem');
  const cetAnual=fSem.cfs.length>2?xirr(fSem.cfs,fSem.dts,0.1):0;           // = planilha (sem bônus)
  const fCom=buildFlow('totalCom');
  const cetAnualComBonus=fCom.cfs.length>2?xirr(fCom.cfs,fCom.dts,0.1):0;   // com bônus de adimplência

  const amortRows=rows.filter(s=>s.principal>0.001);
  return {rows,sched:rows,cd,
    disbDetail:cd.map(x=>({dtLib:x.B,valor:x.C,alloc:x.H,busDays:x.I,juroSem:x.P})),
    qtdPrest:D7,data1a,venc,base,dia,
    totalJurosSem:Math.round(totK*100)/100,totalJurosCom:Math.round(totL*100)/100,
    totalPrincipal:Math.round(totJ*100)/100,totalBonus:Math.round((totK-totL)*100)/100,
    mediaPrestCom:amortRows.length?amortRows.reduce((s,r)=>s+r.totalCom,0)/amortRows.length:0,
    cetAnual,cetMensal:Math.pow(1+cetAnual,1/12)-1,
    cetAnualComBonus,cetMensalComBonus:Math.pow(1+cetAnualComBonus,1/12)-1,custosTotal};
}

// ============================================================
// V2 — MOTOR FISCAL POR REGIME (fórmulas verificadas, data-base 02/07/2026)
// Lucro Real: juros dedutíveis (34%/24%); aplicação a ~37,07% (34% + PIS/COFINS 4,65% dedutível)
// SUDENE: benefício NÃO alcança receita financeira; juros em 2 camadas (34% até rec.fin.; excedente 17,125%/15,25%)
// Presumido: juros sem escudo; aplicação somada 100% à base (24–34%); PIS/COFINS zero (cumulativo)
// Simples: juros sem escudo; DAS inalterado; aplicação IRRF definitivo 22,5%→15%
// ============================================================
const IRRF_SIMPLES = {'180-':0.225,'360':0.20,'720':0.175,'720+':0.15};

function fiscal(){
  const c = S.cliente;
  const f = { regime:c.regime, escudoBase:0, escudoExced:0, cargaAplic:0, sudene:false, labels:{} };
  if(c.regime==='lucro_real'){
    f.escudoBase = c.acimaAdicional ? 0.34 : 0.24;
    f.cargaAplic = c.acimaAdicional ? 0.3707 : (0.24 + 0.0465*(1-0.24)); // 34%/24% + PIS/COFINS 4,65% dedutível
    f.sudene = !!c.sudeneAplica;
    f.escudoExced = c.sudeneNovo ? (0.25*(1-0.675)+0.09) : (0.25*(1-0.75)+0.09); // 17,125% | 15,25%
    f.labels.regime = 'Lucro Real' + (f.sudene ? ' + SUDENE' : '');
  } else if(c.regime==='presumido'){
    f.escudoBase = 0;
    f.cargaAplic = c.acimaAdicional ? 0.34 : 0.24; // adição integral à base do IRPJ/CSLL
    f.labels.regime = 'Lucro Presumido';
  } else {
    f.escudoBase = 0;
    f.cargaAplic = IRRF_SIMPLES[c.prazoAplic] ?? 0.15; // IRRF exclusivo/definitivo
    f.labels.regime = 'Simples Nacional';
  }
  // escudo fiscal do mês sobre juros pagos (SUDENE em 2 camadas contra a receita financeira do mês)
  f.escudoMes = (juros, rendBrutoMes) => {
    if(c.regime!=='lucro_real' || juros<=0) return 0;
    if(!f.sudene) return juros*f.escudoBase;
    const dentro = Math.min(juros, Math.max(rendBrutoMes,0));
    return dentro*0.34 + (juros-dentro)*f.escudoExced;
  };
  f.escudoSimples = juros => (c.regime==='lucro_real' && juros>0) ? juros*f.escudoBase : 0;
  f.rendLiq  = r => r*(1-f.cargaAplic);
  f.custoLiq = i => i*(1-f.escudoBase);
  f.breakEven = r => c.regime==='lucro_real' ? r*(1-f.cargaAplic)/(1-f.escudoBase) : r*(1-f.cargaAplic);
  return f;
}

const iofPct = () => S.mercado.fneIsentoIOF ? 0 : (S.mercado.iofFixo + S.mercado.iofDia*365)/100; // teto p/ >365d
const custoRealFNE = R => (1+R.cetAnualComBonus)/(1+S.mercado.ipca/100)-1;
const taxaAplicBruta = () => (S.mercado.cdi/100)*((+S.cliente.pctCDI||100)/100);

// ============================================================
// V2 — DOIS MUNDOS: pagar à vista (descapitalizar) × financiar FNE mantendo o caixa aplicado
// Grade mensal = cronograma real do runSim. Simplificações documentadas:
// rendimento composto à taxa anual LÍQUIDA; desembolsos na data de alocação do cronograma;
// IOF pelo teto de 365 dias quando habilitado.
// ============================================================
function doisMundos(R, ovr){
  const f = fiscal();
  const m = S.mercado;
  const rBruta = (ovr&&ovr.rBruta!=null) ? ovr.rBruta : taxaAplicBruta();
  const rLiq = f.rendLiq(rBruta);
  const mLiq = Math.pow(1+rLiq,1/12)-1;
  const mBruta = Math.pow(1+rBruta,1/12)-1;
  const totalProjeto = R.cd.reduce((s,x)=>s+x.C,0);
  const capInformado = +S.cliente.valorAplicado||0;
  const cap = Math.max(capInformado, totalProjeto);
  const avisoCapital = capInformado>0 && capInformado<totalProjeto;
  const tIOF = (ovr&&ovr.iof!=null) ? ovr.iof : iofPct()/100;
  let a=cap, b=cap, custosLancados=false, escudoTotal=0;
  const pts=[{data:R.rows[0].data, a, b}];
  // fluxos do mês 0 (desembolso na contratação)
  const fluxoMes = (row, primeiro) => {
    if(row.disbValor>0){
      a -= row.disbValor;
      if(tIOF>0) b -= row.disbValor*tIOF;
      if(!custosLancados){ b -= R.custosTotal; custosLancados=true; }
    }
    if(row.totalCom>0){
      const rendB = primeiro?0:b>0?b*mBruta:0;
      const escudo = f.escudoMes(row.juroPagoCom, rendB);
      escudoTotal += escudo;
      b -= (row.totalCom - escudo);
    }
  };
  fluxoMes(R.rows[0], true);
  pts[0].a=a; pts[0].b=b;
  for(let i=1;i<R.rows.length;i++){
    const row=R.rows[i];
    a = a*(1+mLiq);
    b = b*(1+mLiq);
    fluxoMes(row,false);
    pts.push({data:row.data, a, b});
  }
  // agregação anual p/ tabela
  const anos=[]; let anoAtual=null;
  pts.forEach(p=>{ const y=p.data.getFullYear();
    if(anoAtual!==y){ anos.push({ano:y, a:p.a, b:p.b, delta:p.b-p.a}); anoAtual=y; }
    else { const u=anos[anos.length-1]; u.a=p.a; u.b=p.b; u.delta=p.b-p.a; }
  });
  const deltaFinal = b-a;
  return {pts, anos, deltaFinal, cap, avisoCapital, rBruta, rLiq, escudoTotal, totalProjeto};
}

// ============================================================
// V2 — KPIs DO PROJETO (payback caixa, TIR desalavancada × custo FNE, VPL, parcela/dia)
// Margem incremental começa no mês seguinte ao último desembolso (planta operando).
// Depreciação (só Lucro Real, opcional) entra AQUI — não no Dois Mundos (o ativo existe nos 2 mundos).
// ============================================================
function kpis(R){
  const f=fiscal(), c=S.cliente, ap=S.apr, fl=S.flags;
  const mult = ap.cenario==='conservador'?+ap.multCons: ap.cenario==='otimista'?+ap.multOtim:1;
  const margem = (+c.margemInc||0)*mult;
  let lastDisbIdx=0; R.rows.forEach((row,i)=>{ if(row.disbValor>0)lastDisbIdx=i; });
  const V=+S.valorFin;
  const escudoDepAno = (c.regime==='lucro_real'&&fl.depIncluir)
    ? V*((fl.depMaq/100)*0.10*(+fl.depTurnos||1) + (fl.depObras/100)*0.04)*f.escudoBase : 0;
  const depMes=escudoDepAno/12;
  let cum = -((+c.contrapartida||0) + R.custosTotal), payback=null;
  const serie=[{data:R.rows[0].data, v:cum}];
  R.rows.forEach((row,i)=>{ if(i===0)return;
    let fx=0;
    if(i>lastDisbIdx && margem>0) fx += margem + depMes;
    if(row.totalCom>0) fx -= (row.totalCom - f.escudoSimples(row.juroPagoCom));
    cum+=fx; serie.push({data:row.data, v:cum});
    if(payback===null && cum>=0) payback=i;
  });
  const cfs=[],dts=[];
  R.rows.forEach((row,i)=>{
    if(row.disbValor>0){cfs.push(-row.disbValor);dts.push(row.data);}
    if(i>lastDisbIdx && margem>0){cfs.push(margem);dts.push(row.data);}
  });
  const tir = (margem>0 && cfs.length>2) ? xirr(cfs,dts,0.15) : null;
  const d0=R.rows[0].data, tx=R.cetAnualComBonus;
  let vpl=0;
  R.rows.forEach((row,i)=>{ let cf=0;
    if(row.disbValor>0)cf-=row.disbValor;
    if(i>lastDisbIdx && margem>0)cf+=margem;
    if(cf!==0){const t=(row.data-d0)/(365*864e5); vpl+=cf/Math.pow(1+tx,t);}
  });
  return {margem, mult, payback, paybackAnos: payback!=null?payback/12:null, tir, vpl,
    escudoDepAno, parcelaDia:R.mediaPrestCom/30, pctMargem: margem>0?R.mediaPrestCom/margem:null,
    serie, opStartIdx:lastDisbIdx+1, opStartData:R.rows[Math.min(lastDisbIdx+1,R.rows.length-1)].data};
}

// Sensibilidade (tornado) sobre a vantagem de financiar — 3 alavancas
function tornado(R, base){
  const rB=taxaAplicBruta();
  const mk=(lbl, lo, hi)=>({lbl, lo:lo-base, hi:hi-base});
  const cdiLo=doisMundos(R,{rBruta:rB-0.02}).deltaFinal, cdiHi=doisMundos(R,{rBruta:rB+0.02}).deltaFinal;
  const iofOn=doisMundos(R,{iof:(S.mercado.iofFixo+S.mercado.iofDia*365)/100/100}).deltaFinal;
  const cLo=Math.min(cdiLo,cdiHi), cHi=Math.max(cdiLo,cdiHi);
  const semBonusFator = R.totalJurosSem>0 ? (R.totalPrincipal+R.totalJurosSem)/(R.totalPrincipal+R.totalJurosCom) : 1;
  const perdaBonus = base - R.totalBonus; // sem pagar em dia, perde o bônus
  return [
    mk('CDI da aplicação ±2 p.p.', cLo, cHi),
    mk('Perder o bônus de adimplência', perdaBonus, base),
    mk('IOF na linha (se incidir)', iofOn, base)
  ];
}

const SVGW=640;
function svgOpen(h){ return `<svg viewBox="0 0 ${SVGW} ${h}" xmlns="http://www.w3.org/2000/svg" role="img">`; }

// Barras horizontais genéricas (régua de ancoragem, TIR × custo)
function svgHBars(rows, opts){
  const o=Object.assign({h:36, gap:10, fmtv:v=>fmtPct1(v), max:null}, opts||{});
  const max=o.max ?? Math.max(...rows.map(r=>r.val))*1.12;
  const H=rows.length*(o.h+o.gap)+8;
  const LW=190, BW=SVGW-LW-96;
  let s=svgOpen(H);
  rows.forEach((r,i)=>{
    const y=4+i*(o.h+o.gap);
    const w=Math.max(6, r.val/max*BW);
    s+=`<text x="${LW-8}" y="${y+o.h/2+4}" text-anchor="end" font-size="13" font-weight="${r.bold?'800':'500'}" fill="#334155">${esc(r.lbl)}</text>`;
    s+=`<rect x="${LW}" y="${y}" width="${w}" height="${o.h}" rx="7" fill="${r.color}" opacity="${r.bold?1:.82}"/>`;
    s+=`<text x="${LW+w+8}" y="${y+o.h/2+5}" font-size="14" font-weight="800" fill="${r.bold?r.color:'#334155'}">${o.fmtv(r.val)}</text>`;
  });
  return s+'</svg>';
}

// Dois Mundos — patrimônio A (à vista) × B (financia) com faixa de carência e cruzamento
function svgDoisMundos(dm, R){
  const H=300, PL=64, PR=14, PT=16, PB=34, W=SVGW-PL-PR, IH=H-PT-PB;
  const pts=dm.pts, n=pts.length;
  const vals=pts.flatMap(p=>[p.a,p.b]);
  let lo=Math.min(...vals), hi=Math.max(...vals); const pad=(hi-lo)*0.06||1; lo-=pad; hi+=pad;
  const X=i=>PL+i/(n-1)*W, Y=v=>PT+(hi-v)/(hi-lo)*IH;
  let s=svgOpen(H);
  // faixa de carência
  const idxCar=pts.findIndex(p=>p.data>=R.data1a);
  if(idxCar>1){
    s+=`<rect x="${PL}" y="${PT}" width="${X(idxCar)-PL}" height="${IH}" fill="#fefce8"/>`;
    s+=`<text x="${(PL+X(idxCar))/2}" y="${PT+14}" text-anchor="middle" font-size="11" fill="#a16207">carência: obra/ramp-up</text>`;
  }
  // grid + eixo Y (4 linhas)
  for(let g=0;g<=3;g++){ const v=lo+(hi-lo)*g/3, y=Y(v);
    s+=`<line x1="${PL}" y1="${y}" x2="${SVGW-PR}" y2="${y}" stroke="#e2e8f0" stroke-width="1"/>`;
    s+=`<text x="${PL-6}" y="${y+4}" text-anchor="end" font-size="10" fill="#94a3b8">${fmtC(v)}</text>`;
  }
  // área entre curvas (vantagem)
  let poly=pts.map((p,i)=>`${X(i)},${Y(p.b)}`).join(' ');
  for(let i=n-1;i>=0;i--) poly+=` ${X(i)},${Y(pts[i].a)}`;
  s+=`<polygon points="${poly}" fill="#16a34a" opacity=".12"/>`;
  const line=(k,color)=>`<polyline points="${pts.map((p,i)=>`${X(i)},${Y(p[k])}`).join(' ')}" fill="none" stroke="${color}" stroke-width="3" stroke-linejoin="round"/>`;
  s+=line('a','#dc2626')+line('b','#16a34a');
  // rótulos finais
  const pf=pts[n-1];
  s+=`<circle cx="${X(n-1)}" cy="${Y(pf.b)}" r="4" fill="#16a34a"/><circle cx="${X(n-1)}" cy="${Y(pf.a)}" r="4" fill="#dc2626"/>`;
  // datas eixo X (início/meio/fim)
  [0,Math.floor((n-1)/2),n-1].forEach(i=>{
    s+=`<text x="${X(i)}" y="${H-10}" text-anchor="${i===0?'start':i===n-1?'end':'middle'}" font-size="10" fill="#64748b">${pts[i].data.getFullYear()}</text>`;
  });
  // legenda
  s+=`<rect x="${PL}" y="${H-30}" width="12" height="4" fill="#dc2626"/><text x="${PL+16}" y="${H-25}" font-size="10.5" fill="#7f1d1d">paga à vista (descapitaliza)</text>`;
  s+=`<rect x="${PL+185}" y="${H-30}" width="12" height="4" fill="#16a34a"/><text x="${PL+201}" y="${H-25}" font-size="10.5" fill="#14532d">financia FNE (caixa aplicado)</text>`;
  return s+'</svg>';
}

// Payback — caixa acumulado do projeto cruzando o zero
function svgPayback(kp, R){
  const H=260, PL=64, PR=14, PT=14, PB=30, W=SVGW-PL-PR, IH=H-PT-PB;
  const pts=kp.serie, n=pts.length;
  let lo=Math.min(...pts.map(p=>p.v)), hi=Math.max(...pts.map(p=>p.v)); const pad=(hi-lo)*0.06||1; lo-=pad; hi+=pad;
  const X=i=>PL+i/(n-1)*W, Y=v=>PT+(hi-v)/(hi-lo)*IH;
  let s=svgOpen(H);
  const idxCar=R.rows.findIndex(r=>r.data>=R.data1a);
  if(idxCar>1) s+=`<rect x="${PL}" y="${PT}" width="${X(idxCar)-PL}" height="${IH}" fill="#fefce8"/>`;
  const y0=Y(0);
  s+=`<line x1="${PL}" y1="${y0}" x2="${SVGW-PR}" y2="${y0}" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>`;
  s+=`<text x="${SVGW-PR}" y="${y0-5}" text-anchor="end" font-size="10" fill="#64748b">zero a zero</text>`;
  // área positiva verde / negativa vermelha
  s+=`<polyline points="${pts.map((p,i)=>`${X(i)},${Y(p.v)}`).join(' ')}" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"/>`;
  if(kp.payback!=null){
    s+=`<circle cx="${X(kp.payback)}" cy="${Y(0)}" r="6" fill="#16a34a" stroke="#fff" stroke-width="2"/>`;
    s+=`<text x="${X(kp.payback)}" y="${Y(0)-12}" text-anchor="middle" font-size="12" font-weight="800" fill="#15803d">aqui o projeto já se pagou (${(kp.payback/12).toLocaleString('pt-BR',{maximumFractionDigits:1})} anos)</text>`;
  }
  [0,Math.floor((n-1)/2),n-1].forEach(i=>{
    s+=`<text x="${X(i)}" y="${H-8}" text-anchor="${i===0?'start':i===n-1?'end':'middle'}" font-size="10" fill="#64748b">${pts[i].data.getFullYear()}</text>`;
  });
  for(let g=0;g<=3;g++){ const v=lo+(hi-lo)*g/3;
    s+=`<text x="${PL-6}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="#94a3b8">${fmtC(v)}</text>`;
  }
  return s+'</svg>';
}

// Waterfall — formação do custo líquido do dinheiro
function svgWaterfall(R, escudoTotal){
  const juros=R.totalJurosSem, bonus=R.totalBonus, esc_=Math.max(escudoTotal,0);
  const liquido=juros-bonus-esc_;
  const steps=[
    {lbl:'Juros contratuais', v:juros, tipo:'base', cor:'#64748b'},
    {lbl:'− Bônus adimplência', v:-bonus, tipo:'menos', cor:'#16a34a'},
    {lbl:'− Economia de IR', v:-esc_, tipo:'menos', cor:'#0ea5e9'},
    {lbl:'Custo líquido', v:liquido, tipo:'total', cor:'#1d4ed8'}
  ];
  const H=250, PL=20, PT=18, PB=52, IH=H-PT-PB, W=SVGW-PL*2;
  const max=juros*1.06;
  const bw=Math.min(120, W/steps.length*0.6), gap=(W-bw*steps.length)/(steps.length-1);
  let s=svgOpen(H), run=0;
  const Y=v=>PT+(max-v)/max*IH;
  steps.forEach((st,i)=>{
    const x=PL+i*(bw+gap);
    let y,hgt,top;
    if(st.tipo==='base'){ y=Y(st.v); hgt=Y(0)-y; run=st.v; top=st.v; }
    else if(st.tipo==='menos'){ const novo=run+st.v; y=Y(run); hgt=Y(novo)-y; top=run; run=novo; }
    else { y=Y(st.v); hgt=Y(0)-y; top=st.v; }
    s+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(hgt,3)}" rx="6" fill="${st.cor}" opacity="${st.tipo==='menos'?.9:1}"/>`;
    if(i<steps.length-1) s+=`<line x1="${x+bw}" y1="${Y(run)}" x2="${x+bw+gap}" y2="${Y(run)}" stroke="#cbd5e1" stroke-dasharray="3 3"/>`;
    s+=`<text x="${x+bw/2}" y="${y-6}" text-anchor="middle" font-size="11.5" font-weight="800" fill="#334155">${st.tipo==='menos'?'−':''}R$ ${fmtC(Math.abs(st.v))}</text>`;
    s+=`<text x="${x+bw/2}" y="${H-34}" text-anchor="middle" font-size="10.5" fill="#64748b">${esc(st.lbl).replace('− ','')}</text>`;
  });
  s+=`<text x="${PL}" y="${H-10}" font-size="10" fill="#94a3b8">Juros totais sem bônus → o que efetivamente pesa no bolso ao longo de todo o contrato</text>`;
  return s+'</svg>';
}

// Tornado — sensibilidade da vantagem de financiar
function svgTornado(items, base){
  const H=items.length*44+40;
  const mid=SVGW/2+60, maxAbs=Math.max(...items.flatMap(t=>[Math.abs(t.lo),Math.abs(t.hi)]),1)*1.1;
  const SC=(SVGW/2-90)/maxAbs;
  let s=svgOpen(H);
  s+=`<line x1="${mid}" y1="8" x2="${mid}" y2="${H-26}" stroke="#94a3b8" stroke-width="1.5"/>`;
  items.forEach((t,i)=>{
    const y=14+i*44;
    const x1=mid+Math.min(t.lo,0)*SC, w1=Math.abs(Math.min(t.lo,0))*SC;
    const w2=Math.max(t.hi,0)*SC;
    if(w1>0.5)s+=`<rect x="${x1}" y="${y}" width="${w1}" height="22" rx="5" fill="#f97316"/>`;
    if(w2>0.5)s+=`<rect x="${mid}" y="${y}" width="${w2}" height="22" rx="5" fill="#16a34a"/>`;
    s+=`<text x="8" y="${y+15}" font-size="11.5" fill="#334155">${esc(t.lbl)}</text>`;
    if(Math.abs(t.lo)>1)s+=`<text x="${x1-4}" y="${y+15}" text-anchor="end" font-size="10.5" fill="#9a3412">${t.lo<0?'−':'+'}R$ ${fmtC(Math.abs(t.lo))}</text>`;
    if(Math.abs(t.hi)>1)s+=`<text x="${mid+w2+4}" y="${y+15}" font-size="10.5" fill="#14532d">+R$ ${fmtC(Math.abs(t.hi))}</text>`;
  });
  s+=`<text x="${mid}" y="${H-8}" text-anchor="middle" font-size="10" fill="#94a3b8">impacto sobre a vantagem-base de financiar (R$ ${fmtC(base)})</text>`;
  return s+'</svg>';
}

// ============================================================
// V2 — LINK PRÉ-PREENCHIDO (hash base64url) + QR CODE embutido
// QR: byte mode, ECC L, versões 1–9 (até 232 bytes), máscara 0 — implementação própria, sem libs.
// ============================================================
const HASH_ESCALAR=['dataContratacao','valorFin','diaAniv','taxaSem','taxaCom','prazoAmort','carencia','periodPrinc','periodCar','parcelasIguais'];
const HASH_GRUPO=['cliente','mercado','flags','apr'];
function encodeEstado(){
  const diff={};
  HASH_ESCALAR.forEach(k=>{ if(String(S[k])!==String(DEF[k])) diff[k]=S[k]; });
  HASH_GRUPO.forEach(g=>{ const d={};
    Object.keys(S[g]).forEach(k=>{ if(JSON.stringify(S[g][k])!==JSON.stringify(DEF[g][k])) d[k]=S[g][k]; });
    if(Object.keys(d).length) diff[g]=d; });
  if(JSON.stringify(S.desembolsos)!==JSON.stringify(DEF.desembolsos))
    diff.d9=S.desembolsos.filter(x=>x.data||x.valor>0).map(x=>[x.data,x.valor]); // compacto
  if(JSON.stringify(S.custos)!==JSON.stringify(DEF.custos))
    diff.c9=S.custos.filter(x=>x.valor>0||x.nome).map(x=>[x.nome,x.valor]);
  const json=JSON.stringify(diff);
  return btoa(unescape(encodeURIComponent(json))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function decodeEstado(b64){
  try{
    const json=decodeURIComponent(escape(atob(b64.replace(/-/g,'+').replace(/_/g,'/'))));
    const diff=JSON.parse(json);
    HASH_ESCALAR.forEach(k=>{ if(k in diff) S[k]=diff[k]; });
    HASH_GRUPO.forEach(g=>{ if(diff[g]&&typeof diff[g]==='object') Object.assign(S[g],diff[g]); });
    if(Array.isArray(diff.d9)){ S.desembolsos=Array.from({length:10},(_,i)=>diff.d9[i]?{data:diff.d9[i][0],valor:+diff.d9[i][1]||0}:{data:'',valor:0}); }
    if(Array.isArray(diff.c9)){ S.custos=diff.c9.map(x=>({nome:String(x[0]),valor:+x[1]||0}));
      while(S.custos.length<5)S.custos.push({nome:'Outros custos',valor:0}); }
    return true;
  }catch(e){ console.warn('hash inválido',e); return false; }
}
function linkAtual(){
  const base=location.href.split('#')[0];
  return base+'#d='+encodeEstado();
}
function copiarLink(){
  const url=linkAtual();
  const done=()=>{ const el=document.getElementById('copiado'); if(el){el.textContent='✅ Link copiado!'; setTimeout(()=>{el.textContent='';},2500);} };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(done).catch(()=>prompt('Copie o link:',url)); }
  else prompt('Copie o link:',url);
}

// ---------- QR encoder ----------
const QR_CAP={1:19,2:34,3:55,4:80,5:108,6:136,7:156,8:194,9:232};       // data codewords (ECC L)
const QR_EC ={1:7,2:10,3:15,4:20,5:26,6:18,7:20,8:24,9:30};             // ec codewords POR BLOCO
const QR_NB ={1:1,2:1,3:1,4:1,5:1,6:2,7:2,8:2,9:2};                     // nº de blocos
const QR_ALIGN={2:[6,18],3:[6,22],4:[6,26],5:[6,30],6:[6,34],7:[6,22,38],8:[6,24,42],9:[6,26,46]};
const GF_EXP=new Array(512), GF_LOG=new Array(256);
(function(){ let x=1; for(let i=0;i<255;i++){ GF_EXP[i]=x; GF_LOG[x]=i; x<<=1; if(x&0x100)x^=0x11d; } for(let i=255;i<512;i++)GF_EXP[i]=GF_EXP[i-255]; })();
const gmul=(a,b)=>(a===0||b===0)?0:GF_EXP[GF_LOG[a]+GF_LOG[b]];
function rsGen(n){ let g=[1]; for(let i=0;i<n;i++){ const ng=new Array(g.length+1).fill(0);
  for(let j=0;j<g.length;j++){ ng[j]^=g[j]; ng[j+1]^=gmul(g[j],GF_EXP[i]); } g=ng; } return g; }
function rsEncode(data,n){ const g=rsGen(n), res=data.concat(new Array(n).fill(0));
  for(let i=0;i<data.length;i++){ const c=res[i]; if(c===0)continue;
    for(let j=0;j<g.length;j++)res[i+j]^=gmul(g[j],c); }
  return res.slice(data.length); }
function bch(val,poly,bits){ // divisão polinomial binária → val<<bits | resto
  const msb=(x)=>{let m=0;while(x>>m)m++;return m;};
  let d=val<<bits, pm=msb(poly);
  while(msb(d)>=pm){ d^=poly<<(msb(d)-pm); }
  return (val<<bits)|d; }
function qrMatrix(text){
  const bytes=[]; const enc=new TextEncoder().encode(text); enc.forEach(b=>bytes.push(b));
  let v=null; for(let i=1;i<=9;i++){ if(bytes.length+2<=QR_CAP[i]){ v=i; break; } }
  if(!v)return null;
  const cap=QR_CAP[v], nb=QR_NB[v], ecn=QR_EC[v], size=17+4*v;
  // bitstream
  const bits=[]; const put=(val,n)=>{ for(let i=n-1;i>=0;i--)bits.push((val>>i)&1); };
  put(4,4); put(bytes.length,8); bytes.forEach(b=>put(b,8));
  const totalBits=cap*8;
  put(0,Math.min(4,totalBits-bits.length));
  while(bits.length%8)bits.push(0);
  const pads=[0xEC,0x11]; let pi=0;
  while(bits.length<totalBits){ put(pads[pi%2],8); pi++; }
  const data=[]; for(let i=0;i<bits.length;i+=8){ let b=0; for(let j=0;j<8;j++)b=(b<<1)|bits[i+j]; data.push(b); }
  // blocos + interleave
  const per=cap/nb, blocks=[], ecs=[];
  for(let b=0;b<nb;b++){ const d=data.slice(b*per,(b+1)*per); blocks.push(d); ecs.push(rsEncode(d,ecn)); }
  const seq=[];
  for(let i=0;i<per;i++)for(let b=0;b<nb;b++)seq.push(blocks[b][i]);
  for(let i=0;i<ecn;i++)for(let b=0;b<nb;b++)seq.push(ecs[b][i]);
  // matriz
  const M=Array.from({length:size},()=>new Array(size).fill(null)); // null=livre p/ dados
  const setF=(r,c,val)=>{ if(r>=0&&r<size&&c>=0&&c<size)M[r][c]=val; };
  const finder=(r,c)=>{ for(let i=-1;i<8;i++)for(let j=-1;j<8;j++){ const rr=r+i,cc=c+j;
    if(rr<0||rr>=size||cc<0||cc>=size)continue;
    const on=(i>=0&&i<=6&&j>=0&&j<=6)&&(i===0||i===6||j===0||j===6||(i>=2&&i<=4&&j>=2&&j<=4));
    M[rr][cc]=on?1:0; } };
  finder(0,0); finder(0,size-7); finder(size-7,0);
  for(let i=8;i<size-8;i++){ if(M[6][i]===null)M[6][i]=(i%2===0)?1:0; if(M[i][6]===null)M[i][6]=(i%2===0)?1:0; }
  (QR_ALIGN[v]||[]).forEach(r=>{(QR_ALIGN[v]||[]).forEach(c=>{
    // pula apenas os 3 cantos que sobrepõem finders
    if((r<=8&&c<=8)||(r<=8&&c>=size-9)||(r>=size-9&&c<=8))return;
    for(let i=-2;i<=2;i++)for(let j=-2;j<=2;j++)
      setF(r+i,c+j,(Math.max(Math.abs(i),Math.abs(j))!==1)?1:0);
  });});
  M[size-8][8]=1; // dark module
  // reservar áreas de formato
  for(let i=0;i<9;i++){ if(M[8][i]===null)M[8][i]=0; if(M[i][8]===null)M[i][8]=0; }
  for(let i=size-8;i<size;i++){ if(M[8][i]===null)M[8][i]=0; if(M[i][8]===null)M[i][8]=0; }
  if(v>=7){ for(let i=0;i<6;i++)for(let j=size-11;j<size-8;j++){ M[i][j]=0; M[j][i]=0; } }
  // dados em zigue-zague com máscara 0
  let bi=0; const dataBits=[]; seq.forEach(b=>{ for(let i=7;i>=0;i--)dataBits.push((b>>i)&1); });
  let col=size-1, up=true;
  while(col>0){
    if(col===6)col--;
    for(let k=0;k<size;k++){
      const r=up?size-1-k:k;
      for(const c of [col,col-1]){
        if(M[r][c]!==null)continue;
        let bit=bi<dataBits.length?dataBits[bi]:0; bi++;
        if((r+c)%2===0)bit^=1; // máscara 0
        M[r][c]=bit;
      }
    }
    col-=2; up=!up;
  }
  // formato (ECC L='01', máscara 0='000') — BCH(15,5) gerador 0x537, XOR 0x5412
  const fmt=bch(0b01000,0b10100110111,10)^0b101010000010010;
  const fb=i=>(fmt>>(14-i))&1; // sequência b14→b0: b14 em (8,0) e em (size-1,8)
  for(let i=0;i<6;i++)M[8][i]=fb(i);
  M[8][7]=fb(6); M[8][8]=fb(7); M[7][8]=fb(8);
  for(let i=9;i<15;i++)M[14-i][8]=fb(i);
  for(let i=0;i<7;i++)M[size-1-i][8]=fb(i);
  for(let i=7;i<15;i++)M[8][size-15+i]=fb(i);
  // versão (v>=7) — BCH(18,6) gerador 0x1F25
  if(v>=7){ const vi=bch(v,0b1111100100101,12);
    for(let i=0;i<18;i++){ const bit=(vi>>i)&1;
      M[Math.floor(i/3)][size-11+(i%3)]=bit;
      M[size-11+(i%3)][Math.floor(i/3)]=bit; }
  }
  return M;
}
function qrSVG(text){
  const M=qrMatrix(text);
  if(!M)return null;
  const size=M.length, Q=4, T=size+Q*2;
  let s=`<svg viewBox="0 0 ${T} ${T}" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect width="${T}" height="${T}" fill="#fff"/>`;
  for(let r=0;r<size;r++)for(let c=0;c<size;c++)if(M[r][c]===1)s+=`<rect x="${c+Q}" y="${r+Q}" width="1" height="1" fill="#000"/>`;
  return s+'</svg>';
}

      R.sched.filter(s=>s.mes>0&&s.totalSem>0.01).forEach(s=>{h+=`<tr class="${s.isGrace?'grace':''}" style="border-bottom:1px solid #eee"><td class="c">${s.isGrace?'C'+s.mes:s.seq}</td><td>${fmtDate(s.data)}</td><td class="r">${s.principal>0.01?fmt(s.principal):'-'}</td><td class="r">${s.juroPagoSem>0.01?fmt(s.juroPagoSem):'-'}</td><td class="r">${fmt(s.totalSem)}</td><td class="r" style="color:#1d4ed8"><b>${fmt(s.totalCom)}</b></td><td class="r" style="color:#16a34a">${s.bonus>0.01?fmt(s.bonus):'-'}</td></tr>`;});

      h+=`</tbody></table>`;
    }
  }
  h+=`</div>`;
  return h;
}

// ---------- Autoteste ----------
const GOLD = { qtdPrest:120, data1a:'05/04/2028', venc:'05/03/2038', totalJurosSem:8047998.84,
  totalJurosCom:6881903.91, totalPrincipal:15000000, totalBonus:1166094.93, mediaPrestCom:173756.15,
  cetAnual:0.10407309, cetAnualComBonus:0.08929488, custosTotal:512500,
  p1Principal:117833.33, p1Juros:95968.18, p1Total:213801.51, pUltTotal:125955.89,
  carenciaQtd:8, carencia1:53888.64, carenciaSoma:1031165.98, numRows:145 };
function runAutoteste(){
  const out=[]; const ok=(nome,got,want,tol)=>{ const pass=Math.abs(got-want)<=(tol??0.011);
    out.push(`<div class="${pass?'t-ok':'t-fail'}">${pass?'✅':'❌'} ${nome}: ${got} ${pass?'':' (esperado '+want+')'}</div>`); };
  // 1) regressão do motor no cenário-padrão
  const bak=JSON.stringify(S);
  ['dataContratacao','valorFin','diaAniv','taxaSem','taxaCom','prazoAmort','carencia','periodPrinc','periodCar','parcelasIguais','reembolso','desembolsos','custos'].forEach(k=>{ S[k]=JSON.parse(JSON.stringify(DEF[k])); });
  const R=calc();
  try{
    ok('qtdPrest',R.qtdPrest,GOLD.qtdPrest,0);
    out.push(`<div class="${fmtDate(R.data1a)===GOLD.data1a?'t-ok':'t-fail'}">${fmtDate(R.data1a)===GOLD.data1a?'✅':'❌'} 1ª prestação: ${fmtDate(R.data1a)}</div>`);
    out.push(`<div class="${fmtDate(R.venc)===GOLD.venc?'t-ok':'t-fail'}">${fmtDate(R.venc)===GOLD.venc?'✅':'❌'} vencimento: ${fmtDate(R.venc)}</div>`);
    ok('totalJurosSem',R.totalJurosSem,GOLD.totalJurosSem); ok('totalJurosCom',R.totalJurosCom,GOLD.totalJurosCom);
    ok('totalPrincipal',R.totalPrincipal,GOLD.totalPrincipal); ok('totalBonus',R.totalBonus,GOLD.totalBonus);
    ok('mediaPrestCom',Math.round(R.mediaPrestCom*100)/100,GOLD.mediaPrestCom);
    ok('CET taxa cheia',R.cetAnual,GOLD.cetAnual,1e-7); ok('CET c/ bônus',R.cetAnualComBonus,GOLD.cetAnualComBonus,1e-7);
    const fa=R.sched.find(s=>s.isAmort&&s.principal>0.001); const am=R.sched.filter(s=>s.principal>0.001);
    ok('1ª parcela total',fa.totalCom,GOLD.p1Total); ok('última parcela total',am[am.length-1].totalCom,GOLD.pUltTotal);
    const gp=R.sched.filter(s=>s.isGrace&&s.juroPagoCom>0.01);
    ok('pagtos na carência',gp.length,GOLD.carenciaQtd,0); ok('1º juro carência',gp[0].juroPagoCom,GOLD.carencia1);
    ok('linhas do cronograma',R.sched.length,GOLD.numRows,0);
  }catch(e){ out.push(`<div class="t-fail">❌ exceção: ${esc(e.message)}</div>`); }
  const rest=JSON.parse(bak); Object.keys(rest).forEach(k=>{ S[k]=rest[k]; }); // restaura por mutação (mantém referências)
  // 2) fórmulas fiscais (r = 14,15%)
  const bak2=JSON.stringify(S.cliente); const r=0.1415;
  S.cliente.regime='lucro_real'; S.cliente.acimaAdicional=true; S.cliente.sudeneAplica=false;
  ok('break-even Lucro Real',fiscal().breakEven(r),0.13492,0.0006);
  S.cliente.sudeneAplica=true; S.cliente.sudeneNovo=true; ok('SUDENE escudo excedente (novo)',fiscal().escudoExced,0.17125,1e-6);
  S.cliente.sudeneNovo=false; ok('SUDENE escudo excedente (75%)',fiscal().escudoExced,0.1525,1e-6);
  S.cliente.regime='presumido'; ok('break-even Presumido 34%',fiscal().breakEven(r),0.09339,1e-5);
  S.cliente.acimaAdicional=false; ok('break-even Presumido 24%',fiscal().breakEven(r),0.10754,1e-5);
  S.cliente.regime='simples'; S.cliente.prazoAplic='720+'; ok('break-even Simples >720d',fiscal().breakEven(r),0.120275,1e-5);
  S.cliente=JSON.parse(bak2);
  // 3) dois mundos: monotonia no CDI
  const R2=calc();
  if(R2){ const dLo=doisMundos(R2,{rBruta:0.10}).deltaFinal, dHi=doisMundos(R2,{rBruta:0.16}).deltaFinal;
    out.push(`<div class="${dHi>dLo?'t-ok':'t-fail'}">${dHi>dLo?'✅':'❌'} Dois Mundos: vantagem cresce com o CDI (${fmtC(dLo)} → ${fmtC(dHi)})</div>`); }
  // 4) QR: gera matriz válida
  const q=qrMatrix('https://exemplo.com/#d=teste');
  out.push(`<div class="${q&&q.length>=21?'t-ok':'t-fail'}">${q&&q.length>=21?'✅':'❌'} QR: matriz ${q?q.length+'×'+q.length:'falhou'}</div>`);
  document.getElementById('autoteste').innerHTML=out.join('');
}

      </div>`).join('')}</div>
    <div class="note">Proposta detalhada = pacote Recomendado (a operação configurada). Essencial e Expansão são estimativas proporcionais — o giro associado pode chegar a 1/3 do investimento (40% para empresas lideradas por mulheres).</div>
    <h3>Como o FNE se compara — sem esconder onde cada um ganha</h3>
    ${fragSemaforo(f)}
    ${fragSudeneDep(kp)}
    <div class="caixabox">🏦 <b>Por que dá para confiar:</b> recursos do Fundo Constitucional de Financiamento do Nordeste (CF/1988), operados pelo Banco do Nordeste — maior banco de desenvolvimento regional da América Latina. Orçamento ${anoRef}: R$ ${fmtBi(m.fneOrcamento)} bi. Del credere do banco já embutido na taxa — sem spread surpresa.</div>`;
  }
  else if(S.tela===5){
    const cen=S.apr.cenario;
    h+=`<h2>Página de decisão</h2>
    <div class="sub">${esc(nomeEmpresa())} · ${esc(c.descProjeto||'projeto de investimento')} · validade: ${S.apr.validadeDias} dias (data-base ${esc(m.dataBase)})</div>
    ${fragSCQA(R,kp,dm)}
    ${fragKPIs(R,kp)}
    <div class="cenpills">
      <button class="${cen==='conservador'?'active':''}" onclick="S.apr.cenario='conservador';render()">Conservador (${Math.round(+S.apr.multCons*100)}%)</button>
      <button class="${cen==='provavel'?'active':''}" onclick="S.apr.cenario='provavel';render()">Provável</button>
      <button class="${cen==='otimista'?'active':''}" onclick="S.apr.cenario='otimista';render()">Otimista (${Math.round(+S.apr.multOtim*100)}%)</button>
    </div>
    ${cen==='conservador'&&kp.pctMargem!=null?`<div class="fraseouro">🛡️ <b>Mesmo com ${Math.round((1-+S.apr.multCons)*100)}% menos margem</b>, a parcela consome ${fmtPct1(kp.pctMargem)} do lucro incremental — o projeto continua de pé.</div>`:''}
    ${kp.margem>0?`<div class="svgtitle">Caixa acumulado do projeto (cenário ${cen}):</div><div class="svgbox">${svgPayback(kp,R)}</div>`:`<div class="avisobox">Informe a margem mensal do projeto em Parâmetros para ver payback, TIR e VPL.</div>`}
    <details class="acc"><summary>E se? — sensibilidade da vantagem de financiar</summary><div class="svgbox">${svgTornado(tornado(R,dm.deltaFinal),dm.deltaFinal)}</div></details>
    ${fragEspera(R)}
    <h3>Próximos passos</h3>
    ${fragPassos()}
    ${S.apr.consultorNome?`<div class="caixabox">📞 <b>${esc(S.apr.consultorNome)}</b>${S.apr.consultorContato?' · '+esc(S.apr.consultorContato):''}</div>`:''}
    <div class="btns" style="gap:8px;flex-wrap:wrap">
      <button class="btn primary" onclick="imprimirProposta()">🖨️ Imprimir / PDF</button>
      <button class="btn gray" onclick="copiarLink()">🔗 Copiar link da simulação</button>
      <span id="copiado" style="align-self:center;font-size:12px;color:#15803d;font-weight:bold"></span>
    </div>
    ${(()=>{ if(!/^https?:/.test(location.protocol))return '<div class="note" style="margin-top:8px">Para gerar QR escaneável, hospede este arquivo em um link (ex.: GitHub Pages) — o botão de link já funciona.</div>';
      const q=qrSVG(linkAtual()); return q?`<div class="qrwrap">${q}<div class="note">📱 Aponte a câmera: abre esta simulação viva, com os dados do cliente</div></div>`:'<div class="note">Link longo demais para QR — use o botão Copiar link.</div>'; })()}
    <div class="disclaimer">Estudo indicativo, não é oferta de crédito. Condições finais definidas pelo BNB na análise (garantias, enquadramento, encargos da Programação FNE vigente). Efeitos fiscais: confirme com o contador. Números de mercado com data-base ${esc(m.dataBase)}.</div>`;
  }
  // navegação
  h+=`<div class="aprnav noprint">
    <button class="btn gray" ${S.tela===1?'style="visibility:hidden"':''} onclick="irTela(${S.tela-1})">← Anterior</button>
    <div class="dots">${[1,2,3,4,5].map(n=>`<span class="${S.tela===n?'on':''}" onclick="irTela(${n})"></span>`).join('')}</div>
    <button class="btn ${S.tela===5?'gray':'primary'}" onclick="${S.tela===5?`set('mode','tecnico')`:`irTela(${S.tela+1})`}">${S.tela===5?'Concluir':'Próxima →'}</button>
  </div></div>`;
  return h;
}

// ---------- impressão ----------
function imprimirProposta(){
  const errs=validar(), R=calc();
  if(!R||errs.length){ alert('Complete a simulação técnica antes de imprimir.'); return; }
  const f=fiscal(), dm=doisMundos(R), kp=kpis(R), c=S.cliente, m=S.mercado;
  const dt=new Date(), dstr=fmtDate(dt);
  const rodape=n=>`<div class="prodape">Estudo indicativo · data-base ${esc(m.dataBase)} · metodologia BNB (dias úteis/252, CET conforme planilha oficial) · emitido em ${dstr} · pág. ${n}</div>`;
  let h='';
  h+=`<div class="ppage pcapa">
    <div style="font-size:13px;color:#2563eb;font-weight:bold">PROPOSTA DE INVESTIMENTO · FNE / BANCO DO NORDESTE</div>
    <h1>${esc(nomeEmpresa())}</h1>
    <div class="sub">${esc(c.descProjeto||'Projeto de investimento')}${c.cidade?' · '+esc(c.cidade)+(c.uf?'/'+esc(c.uf):''):''}</div>
    <div style="margin-top:26px;font-size:20px;font-weight:800">R$ ${fmt(+S.valorFin)}</div>
    <div class="sub">${((+S.prazoAmort)+(+S.carencia))/12} anos · ${(+S.carencia)/12} de carência · taxa ${(+S.taxaCom).toLocaleString('pt-BR')}% a.a. com bônus</div>
    <div style="margin-top:34px;font-size:12px;color:#475569">Emitida em ${dstr} · validade ${S.apr.validadeDias} dias${S.apr.consultorNome?`<br>Apresentação: ${esc(S.apr.consultorNome)}${S.apr.consultorContato?' · '+esc(S.apr.consultorContato):''}`:''}</div>
  </div>`;
  h+=`<div class="ppage"><h2>1. Decisão em uma página</h2>${fragSCQA(R,kp,dm)}${fragKPIs(R,kp)}${fragEspera(R)}
    <h2>Próximos passos</h2>${fragPassos()}
    <div style="margin-top:22px;font-size:12px">De acordo para iniciar: ____________________________________ &nbsp;&nbsp; Data: ____/____/______</div>${rodape(2)}</div>`;
  const gp=R.sched.filter(s=>s.isGrace&&s.juroPagoCom>0.01);
  h+=`<div class="ppage"><h2>2. A operação em números</h2>
    <div class="kpirow">
      <div class="kpi"><div class="v">R$ ${fmt0(R.mediaPrestCom)}</div><div class="t">Parcela média c/ bônus</div></div>
      <div class="kpi"><div class="v">R$ ${fmtC(R.totalPrincipal+R.totalJurosCom)}</div><div class="t">Total a devolver</div></div>
      <div class="kpi"><div class="v">${fmtPct2(R.cetAnualComBonus)}</div><div class="t">CET a.a. c/ bônus</div></div>
      <div class="kpi"><div class="v">${fmtPct2(R.cetAnual)}</div><div class="t">CET a.a. taxa cheia</div></div>
    </div>
    <p style="font-size:12px;margin:6px 0">Taxas: ${(+S.taxaCom).toLocaleString('pt-BR')}% a.a. com bônus de adimplência (${(+S.taxaSem).toLocaleString('pt-BR')}% sem) · economia por pontualidade: <b>R$ ${fmt(R.totalBonus)}</b> · custos incluídos no CET: R$ ${fmt(R.custosTotal)} · ${gp.length} pagamentos de juros na carência (média R$ ${fmt0(gp.length?gp.reduce((s,x)=>s+x.juroPagoCom,0)/gp.length:0)}).</p>
    <div class="svgbox">${svgWaterfall(R,dm.escudoTotal)}</div>
    <h2>Primeiras 12 parcelas</h2>
    <table><thead class="th-blue"><tr><th>#</th><th>DATA</th><th class="r">PRINCIPAL</th><th class="r">JUROS</th><th class="r">TOTAL</th></tr></thead><tbody>
    ${R.sched.filter(s=>s.isAmort&&s.seq<=12&&s.principal>0.001).map(s=>`<tr><td class="c">${s.seq}</td><td>${fmtDate(s.data)}</td><td class="r">${fmt(s.principal)}</td><td class="r">${fmt(s.juroPagoCom)}</td><td class="r"><b>${fmt(s.totalCom)}</b></td></tr>`).join('')}
    </tbody></table>${rodape(3)}</div>`;
  h+=`<div class="ppage"><h2>3. Financiar × usar o próprio caixa</h2>
    ${fragMundos(R,dm,f)}
    <div class="deltafinal"><div class="t">Vantagem de financiar mantendo o caixa aplicado</div><div class="v">+ R$ ${fmtC(dm.deltaFinal)}</div></div>
    <div class="svgbox">${svgDoisMundos(dm,R)}</div>
    ${fragRegimeExpl(R,f,dm)}
    ${fragTabelaAnual(dm)}${rodape(4)}</div>`;
  h+=`<div class="ppage"><h2>4. Comparativo de fontes & premissas</h2>
    ${fragSemaforo(f)}
    ${fragSudeneDep(kp)}
    <h2>Premissas</h2>
    <p style="font-size:11.5px">Selic ${m.selic}% · CDI ${m.cdi}% · IPCA 12m ${m.ipca}% · aplicação do cliente: ${c.pctCDI}% do CDI · regime: ${esc(f.labels.regime)} · cenário de margem: ${esc(S.apr.cenario)} · INCC ${m.incc}% · IOF ${m.fneIsentoIOF?'isento na linha (confirmar)':'incluído'} · data-base ${esc(m.dataBase)}.</p>
    <p style="font-size:11.5px">Este estudo é indicativo e não constitui oferta de crédito nem aconselhamento tributário; condições finais definidas pelo Banco do Nordeste na análise da proposta (Programação FNE vigente, garantias e enquadramento). Efeitos fiscais dependem da apuração de cada empresa — valide com o contador.</p>
    ${(()=>{ if(!/^https?:/.test(location.protocol))return '';
      const q=qrSVG(linkAtual()); return q?`<div class="qrwrap">${q}<div style="font-size:10.5px;color:#64748b">Simulação viva: aponte a câmera</div></div>`:''; })()}
    ${rodape(5)}</div>`;
  document.getElementById('printdoc').innerHTML=h;
  window.print();
}

// ---------- init ----------
(function(){
  if(location.hash&&location.hash.startsWith('#d=')) decodeEstado(location.hash.slice(3));
  render();
})();
</script>
</body>
</html>
